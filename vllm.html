<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Follow one streaming chat request through vllm serve, across the API and EngineCore processes, with links to the exact source lines.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>vLLM Request Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed node canvas, top command bar, right inspector, bottom trace transport. Dark-only by request. */
:root{
  color-scheme: dark;
  --bg:#0a0d11; --bg-2:#0f1318; --panel:#12161c; --panel-2:#171c23; --line:#232a33; --line-2:#2e3742;
  --fg:#d8dee7; --fg-2:#9aa5b4; --fg-3:#647083;
  --hot:#ffb547; --hot-dim:rgba(255,181,71,.16); --loop:#b993ff; --startup:#5fb3a9; --branch:#4a5463;
  --c-client:#8b96a8; --c-http:#4cb6ac; --c-serve:#64a0f2; --c-build:#7f8cf2; --c-eclient:#a28af0;
  --c-core:#cf86da; --c-sched:#f08a5d; --c-runner:#9cc65b; --c-model:#58c6df; --c-kern:#e2cf6b;
  --c-samp:#f17a96; --c-upd:#c08ae0; --c-out:#59cc9c; --c-parse:#64a0f2;
  --sans:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--sans);overflow:hidden;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
a{color:var(--c-parse)}

.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 340px}
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:9px 16px;padding-top:calc(9px + env(safe-area-inset-top,0px));background:var(--bg-2);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-weight:700;font-size:15px;letter-spacing:.01em}
.brand span{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.brand a{color:var(--fg-3);text-decoration:none;border-bottom:1px dotted var(--line-2)}
.search{position:relative;flex:0 1 260px;min-width:160px}
.search input{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 52px 6px 28px;color:var(--fg);font:12px var(--mono)}
.search input::placeholder{color:var(--fg-3)}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);fill:var(--fg-3)}
.search .count{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--fg-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;cursor:pointer;color:var(--fg-2);user-select:none}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--fg-3);background:var(--panel-2)}
.chip[aria-pressed="false"] i{opacity:.3}
.chip .n{font:10px var(--mono);color:var(--fg-3)}
.spacer{flex:1}
.zoomctl{display:flex;align-items:center;gap:4px}
.ibtn{border:1px solid var(--line-2);background:var(--panel);border-radius:6px;height:28px;min-width:28px;padding:0 8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--fg-2)}
.ibtn:hover{color:var(--fg);border-color:var(--fg-3)}
.ibtn.primary{border-color:rgba(255,181,71,.5);color:var(--hot);background:var(--hot-dim)}
.zoomctl .pct{font:11px var(--mono);color:var(--fg-3);width:42px;text-align:center}

/* canvas */
.canvas{position:relative;overflow:hidden;cursor:grab;touch-action:none;background-color:var(--bg);
  background-image:radial-gradient(circle,#1d232c 1.1px,transparent 1.2px)}
.canvas.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wires .hit{pointer-events:stroke;stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
.wire{fill:none;stroke-width:1.6;transition:opacity .18s,stroke-width .12s}
.wire.k-branch{stroke:var(--branch);stroke-dasharray:4 4}
.wire.k-backend{stroke:#35505a;stroke-dasharray:2 4}
.wire.k-startup{stroke:var(--startup);opacity:.55;stroke-dasharray:6 4}
.wire.k-loop{stroke:var(--loop);stroke-dasharray:7 5;stroke-width:1.8}
.wire.k-hot{stroke:var(--hot);stroke-width:2.2;opacity:.85}
.wire.k-hot.flow{stroke-dasharray:10 8;animation:flow 1.1s linear infinite}
.glow{fill:none;stroke:var(--hot);stroke-width:7;opacity:.10;filter:blur(3px);pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-36}}
.wire.lit{stroke-width:3.2;opacity:1}
.wire.k-branch.lit,.wire.k-backend.lit{stroke:#8b97a8}
.wire.k-startup.lit{opacity:1}
.wlabel{font:10.5px var(--mono);fill:var(--fg-3);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.wlabel.k-loop{fill:var(--loop)}
.wlabel.k-hot{fill:#c99245}
.dim-wires .wire:not(.lit),.dim-wires .glow{opacity:.1}
.dim-wires .wlabel:not(.lit){opacity:.15}
.trav{stroke:#fff3dc!important;opacity:1!important}
.packet{fill:#fff3dc;filter:drop-shadow(0 0 6px var(--hot))}

.lane-h{position:absolute;font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;padding-bottom:6px;border-bottom:1px solid var(--line);width:244px;display:flex;justify-content:space-between}
.lane-h small{font:10px var(--mono);letter-spacing:0;text-transform:none;color:var(--fg-3)}
.band{position:absolute;border:1px dashed #22413e;border-radius:10px;background:rgba(95,179,169,.03)}
.packet[cx="-100"]{display:none}
.pbound{position:absolute;width:0;border-left:1px dashed rgba(185,139,196,.45);pointer-events:none}
.pbound span{position:absolute;left:-10px;writing-mode:vertical-rl;transform:rotate(180deg);font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#b98bc4;background:var(--bg);padding:8px 3px;white-space:nowrap}
.band span{position:absolute;left:12px;top:-9px;padding:0 6px;background:var(--bg);font:600 10px var(--sans);letter-spacing:.14em;color:var(--startup);text-transform:uppercase}

.node{position:absolute;width:244px;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:7px;cursor:pointer;user-select:none;transition:opacity .18s,border-color .15s,box-shadow .15s;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.node .hd{display:flex;align-items:center;gap:7px;padding:6px 9px 5px;border-bottom:1px solid var(--line);border-radius:7px 7px 0 0;position:relative}
.node .hd::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;border-radius:7px 7px 0 0;background:var(--lc)}
.node .tt{font-weight:600;font-size:13px;line-height:1.2;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .bd{padding:6px 9px 8px;display:grid;gap:2px}
.node .fn{font:11px/1.35 var(--mono);color:#c3cdda;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .loc{font:10px var(--mono);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .tag{font:9.5px var(--mono);padding:1px 5px;border-radius:3px;border:1px solid var(--line-2);color:var(--fg-3);white-space:nowrap}
.node.k-hot .tag{color:var(--hot);border-color:rgba(255,181,71,.4)}
.node.k-startup .tag{color:var(--startup);border-color:rgba(95,179,169,.4)}
.node .step{font:600 10px var(--mono);color:#1a1206;background:var(--hot);border-radius:3px;padding:0 4px;min-width:14px;text-align:center}
.node .port{position:absolute;top:24px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--lc);box-sizing:border-box}
.node .port.in{left:-5px}.node .port.out{right:-5px}
.node.k-hot{border-color:#3a3226}
.node.k-branch,.node.k-backend{background:#10141a}
.node.k-branch .tt,.node.k-backend .tt{color:var(--fg-2)}
.node:hover{border-color:var(--fg-3)}
.node.sel{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot),0 0 26px rgba(255,181,71,.22)}
.node.cur{border-color:#fff3dc;box-shadow:0 0 0 2px #fff3dc,0 0 34px rgba(255,181,71,.45)}
.node.visited{border-color:#6b5532}
.dim-nodes .node:not(.lit){opacity:.28}
.searching .node:not(.hit){opacity:.18}
.searching .node.hit{border-color:var(--c-parse)}
.node.dragging{cursor:grabbing;box-shadow:0 14px 30px rgba(0,0,0,.55);z-index:3}

.tip{position:fixed;z-index:20;max-width:300px;background:#0c0f14;border:1px solid var(--line-2);border-radius:7px;padding:9px 11px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:12.5px;color:var(--fg)}
.tip b{display:block;font-size:12px;margin-bottom:3px;color:var(--hot)}
.tip code{font:11px var(--mono);color:var(--fg-2)}

/* inspector */
.insp{background:var(--bg-2);border-left:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;z-index:4}
.insp h2{margin:0;font-size:19px;line-height:1.15;font-weight:700;text-wrap:balance}
.insp .eyebrow{display:flex;gap:8px;align-items:center;font:600 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
.insp .eyebrow i{width:8px;height:8px;border-radius:2px;background:var(--lc)}
.insp .fnline{font:12px var(--mono);color:#c3cdda;word-break:break-word;margin-top:6px}
.insp .src{display:inline-flex;gap:6px;align-items:center;font:11.5px var(--mono);margin-top:6px;color:var(--c-parse);text-decoration:none;word-break:break-all}
.insp .src:hover{text-decoration:underline}
.insp p{margin:0;color:var(--fg-2);font-size:13.5px;line-height:1.55;max-width:62ch}
.sec{display:grid;gap:7px}
.sec > h3{margin:0;font:600 10.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3)}
.payload{margin:0;background:#080a0d;border:1px solid var(--line);border-left:2px solid var(--hot);border-radius:5px;padding:9px 10px;font:11px/1.5 var(--mono);color:#e9d5b0;white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.payload .c{color:var(--fg-3)}
.calls{list-style:none;margin:0;padding:0;display:grid;gap:1px;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.calls li{background:var(--panel);padding:6px 9px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.calls li span{font:11px var(--mono);color:#c3cdda;min-width:0;word-break:break-word}
.calls li a{font:10.5px var(--mono);color:var(--fg-3);white-space:nowrap;text-decoration:none}
.calls li a:hover{color:var(--c-parse)}
.jumps{display:flex;flex-wrap:wrap;gap:5px}
.jump{border:1px solid var(--line-2);background:var(--panel);border-radius:5px;padding:4px 8px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--fg-2);text-align:left}
.jump:hover{color:var(--fg);border-color:var(--fg-3)}
.jump i{width:6px;height:6px;border-radius:50%;background:var(--lc);flex:none}
.jump.hot{border-color:rgba(255,181,71,.35);color:var(--fg)}
.jump em{font-style:normal;font:10px var(--mono);color:var(--fg-3)}
.navrow{display:flex;gap:6px}
.navrow .ibtn{flex:1}
.narr{border:1px solid rgba(255,181,71,.35);background:linear-gradient(180deg,rgba(255,181,71,.08),transparent);border-radius:7px;padding:10px 12px;display:grid;gap:5px}
.narr .k{font:600 10.5px var(--mono);color:var(--hot);letter-spacing:.04em}
.narr p{color:var(--fg)}
.empty{color:var(--fg-2);display:grid;gap:12px}
.empty ol{margin:0;padding-left:18px;display:grid;gap:6px}
.kbd{font:10.5px var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--fg-2)}
.closeinsp{display:none}

/* transport */
.transport{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(15,19,24,.94);border:1px solid var(--line-2);border-radius:10px;padding:7px 9px 7px 12px;box-shadow:0 12px 34px rgba(0,0,0,.5);z-index:4;max-width:calc(100% - 32px);box-sizing:border-box}
.transport .lbl{display:grid;min-width:0;width:300px}
.transport .lbl small{font:600 10px var(--mono);color:var(--hot);letter-spacing:.05em}
.transport .lbl span{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transport .prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.transport .prog b{display:block;height:100%;background:var(--hot);width:0;transition:width .3s}
.transport .ibtn{height:30px;min-width:30px;white-space:nowrap}
.transport label{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--fg-2);white-space:nowrap;cursor:pointer}
.transport input{accent-color:var(--hot)}
.speed{display:flex;align-items:center;gap:6px;font:600 10px var(--mono);color:var(--fg-3);letter-spacing:.05em;white-space:nowrap}
.speed select{appearance:none;-webkit-appearance:none;background:var(--panel);color:var(--fg);border:1px solid var(--line-2);border-radius:6px;height:30px;padding:0 24px 0 9px;font:500 12px var(--mono);cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--fg-3) 50%),linear-gradient(135deg,var(--fg-3) 50%,transparent 50%);background-position:calc(100% - 13px) 13px,calc(100% - 9px) 13px;background-size:4px 4px;background-repeat:no-repeat}
.speed select:hover{border-color:var(--fg-3)}
.transport .dwell{height:2px;border-radius:2px;overflow:hidden;margin-top:2px;background:transparent}
.transport .dwell b{display:block;height:100%;width:0;background:rgba(255,181,71,.45)}

.legend{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:5px;background:rgba(15,19,24,.92);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:11.5px;color:var(--fg-2);z-index:3}
.legend div{display:flex;align-items:center;gap:8px}
.legend svg{flex:none}
.mini{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:rgba(15,19,24,.92);border:1px solid var(--line);border-radius:8px;z-index:3;cursor:pointer}
.mini rect.v{fill:rgba(255,181,71,.07);stroke:var(--hot);stroke-width:1}

@media (max-width: 1100px){ .legend{display:none} }
@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .insp{position:fixed;left:0;right:0;bottom:0;max-height:52%;border-left:0;border-top:1px solid var(--line);border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.5)}
  .insp.closed{display:none}
  .closeinsp{display:inline-flex;position:absolute;right:12px;top:12px}
  .mini{display:none}
  .transport .lbl{width:auto;flex:1 1 120px}
  .speed span{display:none}
  .transport{gap:6px}
  .transport label{display:none}
  .search{flex:1 1 100%}
}
@media (prefers-reduced-motion: reduce){ .wire.k-hot.flow{animation:none} .node,.wire{transition:none} }
</style>
<style>
/* Back link to the index page (added for the repo). */
.home{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 7px;border:1px solid var(--line-2);border-radius:6px;color:var(--fg-2);text-decoration:none;font-size:12px;white-space:nowrap;flex:none}
.home:hover{color:var(--fg);border-color:var(--fg-3)}
.home svg{flex:none}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <a class="home" href="index.html" title="Back to all tracers"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 3 2 8l5 5M2.5 8H14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>All tracers</a>
    <div class="brand"><b>vLLM</b><span>request tracer · <a id="commitlink" href="https://github.com/vllm-project/vllm/tree/138810056093301f4881050fcf2b1786939da387" target="_blank" rel="noopener">1388100</a> · Oct 4 2026</span></div>
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.7 9.6a5.5 5.5 0 1 0-1.1 1.1l3.9 3.9 1.1-1.1-3.9-3.9zM6.3 10.3a4 4 0 1 1 0-8 4 4 0 0 1 0 8z"/></svg>
      <input id="q" type="search" placeholder="Search functions, files…" aria-label="Search nodes" autocomplete="off">
      <span class="count" id="qcount"></span>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
    <div class="spacer"></div>
    <div class="zoomctl">
      <button class="ibtn primary" id="btnHot" title="Fit the common request path">Hot path</button>
      <button class="ibtn" id="btnOut" aria-label="Zoom out">−</button>
      <span class="pct" id="pct">100%</span>
      <button class="ibtn" id="btnIn" aria-label="Zoom in">+</button>
      <button class="ibtn" id="btnFit" title="Fit everything (F)">Fit</button>
    </div>
  </header>

  <main class="canvas" id="canvas" aria-label="Request flow graph">
    <div class="world" id="world">
      <svg class="wires" id="wires" width="1" height="1">
        <defs></defs>
        <g id="glows"></g><g id="wiresG"></g><g id="labels"></g><g id="hits"></g>
        <circle class="packet" id="packet" r="5" cx="-100" cy="-100"/>
      </svg>
    </div>

    <div class="legend" aria-label="Legend">
      <div><svg width="30" height="6"><line x1="0" y1="3" x2="30" y2="3" stroke="#ffb547" stroke-width="2.2" stroke-dasharray="10 6"/></svg>Hot path · streaming chat, 1 GPU</div>
      <div><svg width="30" height="6"><line x1="0" y1="3" x2="30" y2="3" stroke="#b993ff" stroke-width="1.8" stroke-dasharray="7 5"/></svg>Per-token loop</div>
      <div><svg width="30" height="6"><line x1="0" y1="3" x2="30" y2="3" stroke="#4a5463" stroke-width="1.6" stroke-dasharray="4 4"/></svg>Alternate route / optional feature</div>
      <div><svg width="30" height="6"><line x1="0" y1="3" x2="30" y2="3" stroke="#5fb3a9" stroke-width="1.6" stroke-dasharray="6 4"/></svg>Startup (runs once)</div>
      <div><svg width="30" height="12"><line x1="15" y1="0" x2="15" y2="12" stroke="#b98bc4" stroke-width="1.4" stroke-dasharray="3 3"/></svg>Process boundary (ZMQ hop)</div>
    </div>

    <div class="transport" id="transport">
      <button class="ibtn" id="tFirst" aria-label="Restart trace" title="Restart">⏮</button>
      <button class="ibtn" id="tPrev" aria-label="Previous step" title="Previous (←)">◀</button>
      <button class="ibtn primary" id="tPlay" aria-label="Play trace" title="Play / pause (Space)">▶ Trace</button>
      <button class="ibtn" id="tNext" aria-label="Next step" title="Next (→)">▶▶</button>
      <div class="lbl"><small id="tStep">TRACE A REQUEST</small><span id="tName">Press ▶ to follow one chat request end to end</span><div class="prog"><b id="tProg"></b></div><div class="dwell" title="Time until the next step"><b id="tDwell"></b></div></div>
      <label class="speed" for="tSpeed"><span>SPEED</span><select id="tSpeed" aria-label="Playback speed" title="Playback speed ([ slower, ] faster)"></select></label>
      <label><input type="checkbox" id="tFollow" checked> Follow</label>
    </div>

    <svg class="mini" id="mini" width="190" height="104" aria-label="Minimap"></svg>
  </main>

  <aside class="insp" id="insp" aria-live="polite"></aside>
</div>
<div class="tip" id="tip" hidden></div>

<script>
const SHA = "138810056093301f4881050fcf2b1786939da387";
const REPO = "https://github.com/vllm-project/vllm";
const GH = `${REPO}/blob/${SHA}/`;

function geom(e){
  const A=byId[e.a], B=byId[e.b];

  else if (A.col===B.col) { c1x=sx+85;c1y=sy;c2x=tx-85;c2y=ty; }
  else { const d=Math.hypot(sx-tx,sy-ty); const drop=170+d*0.22; c1x=sx+260;c1y=Math.max(sy,ty)+drop;c2x=tx-260;c2y=Math.max(sy,ty)+drop; }
  c1x+=e.ox;c1y+=e.oy;c2x+=e.ox;c2y+=e.oy;
  return {sx,sy,c1x,c1y,c2x,c2y,tx,ty};
}

const bez=(g,t)=>{const m=1-t;return{x:m*m*m*g.sx+3*m*m*t*g.c1x+3*m*t*t*g.c2x+t*t*t*g.tx,y:m*m*m*g.sy+3*m*m*t*g.c1y+3*m*t*t*g.c2y+t*t*t*g.ty}};

  if(!drag.moved) return;
  if(drag.type==="pan"){ cam.x=drag.cx+dx; cam.y=drag.cy+dy; applyCam(); }
  else { const n=drag.n; n.x=drag.nx+dx/cam.k; n.y=drag.ny+dy/cam.k; n.el.style.left=n.x+"px"; n.el.style.top=n.y+"px"; [...n.ins,...n.outs].forEach(drawEdge); drawMini(); }
});
function endPtr(ev){
  pointers.delete(ev.pointerId); if(pointers.size<2) pinch=null;
  if(!drag) return;
  if(!drag.moved && drag.type==="node") select(drag.n.id,false);
  else if(!drag.moved && drag.type==="pan" && ev.type==="pointerup") { if(drag.edge) select(drag.edge.b,true); else if(sel) select(null); }
  if(drag.type==="node") drag.n.el.classList.remove("dragging");
  canvas.classList.remove("panning"); drag=null;
}
canvas.addEventListener("pointerup",endPtr); canvas.addEventListener("pointercancel",endPtr);
canvas.addEventListener("wheel",ev=>{
  ev.preventDefault(); const v=viewRect();
  const wheelLike = ev.deltaMode!==0 || (ev.deltaX===0 && Math.abs(ev.deltaY)>=50);
  if((ev.ctrlKey||ev.metaKey||wheelLike) && !ev.shiftKey){
    zoomAt(ev.clientX-v.l, ev.clientY-v.t, cam.k*Math.exp(-ev.deltaY*(ev.ctrlKey?0.012:0.0018)));
  } else { cam.x-=ev.deltaX; cam.y-=ev.deltaY; applyCam(); }
},{passive:false});
$("#btnIn").onclick=()=>{const v=viewRect();zoomAt(v.w/2,v.h/2,cam.k*1.2)};
$("#btnOut").onclick=()=>{const v=viewRect();zoomAt(v.w/2,v.h/2,cam.k/1.2)};
$("#btnFit").onclick=()=>fitNodes(visibleNodes(),1);
$("#btnHot").onclick=()=>fitNodes(N.filter(n=>n.k==="hot"),1);

/* ---------------- hover highlighting + tooltip ---------------- */
let hoverNode=null;
function setLit(nodes,edgesLit){
  N.forEach(n=>n.el.classList.toggle("lit",nodes.has(n.id)));
  edges.forEach(e=>{ const on=edgesLit.has(e); e.el.classList.toggle("lit",on); e.lab&&e.lab.classList.toggle("lit",on); });
  const any=nodes.size>0;
  canvas.classList.toggle("dim-nodes",any); wires.classList.toggle("dim-wires",any);
}
function clearLit(){ N.forEach(n=>n.el.classList.remove("lit")); edges.forEach(e=>{e.el.classList.remove("lit");e.lab&&e.lab.classList.remove("lit")}); canvas.classList.remove("dim-nodes"); wires.classList.remove("dim-wires"); }
function litNode(n){ const ns=new Set([n.id]), es=new Set(); [...n.ins,...n.outs].forEach(e=>{ if(byId[e.a].el.hidden||byId[e.b].el.hidden) return; es.add(e); ns.add(e.a); ns.add(e.b); }); setLit(ns,es); }
function showTip(html,x,y){ tip.innerHTML=html; tip.hidden=false; const r=tip.getBoundingClientRect(); let L=x+16,T=y+16; if(L+r.width>innerWidth-8) L=x-r.width-12; if(T+r.height>innerHeight-8) T=y-r.height-12; tip.style.left=L+"px"; tip.style.top=T+"px"; }
function hideTip(){ tip.hidden=true; }
world.addEventListener("pointerover",ev=>{
  const el=ev.target.closest(".node"); if(!el||drag?.moved) return;
  const n=byId[el.dataset.id]; hoverNode=n; litNode(n);
  // nudge connected cables outward a touch
  [...n.ins,...n.outs].forEach(e=>{ e.ty = e.b===n.id ? -6 : 6; }); if(!reduced) kick();
});
world.addEventListener("pointermove",ev=>{ const el=ev.target.closest(".node"); if(el && !drag?.moved && ev.pointerType==="mouse"){ const n=byId[el.dataset.id]; showTip(`<b>${esc(n.t)}</b>${esc(n.n)}<br><code>${n.f?esc(srcLabel(n.f,n.l)):""}</code>`,ev.clientX,ev.clientY); } });
world.addEventListener("pointerout",ev=>{
  const el=ev.target.closest(".node"); if(!el) return; if(ev.relatedTarget && el.contains(ev.relatedTarget)) return;
  const n=byId[el.dataset.id]; [...n.ins,...n.outs].forEach(e=>{e.tx=0;e.ty=0;}); kick();
  hoverNode=null; hideTip(); restoreLit();
});
hitsG.addEventListener("pointerover",ev=>{ const e=ev.target.__e; if(!e) return; setLit(new Set([e.a,e.b]),new Set([e])); });
hitsG.addEventListener("pointermove",ev=>{
  const e=ev.target.__e; if(!e||drag) return; const v=viewRect();
  const wx=(ev.clientX-v.l-cam.x)/cam.k, wy=(ev.clientY-v.t-cam.y)/cam.k;
  const dx=wx-e.mid.x, dy=wy-e.mid.y, L=Math.hypot(dx,dy)||1, m=Math.min(46,L*0.5);
  e.tx=dx/L*m; e.ty=dy/L*m; if(!reduced) kick();
  const A=byId[e.a],B=byId[e.b];
  if(ev.pointerType==="mouse") showTip(`<b>${esc(A.t)} → ${esc(B.t)}</b>${e.label?esc(e.label)+"<br>":""}<code>${esc({hot:"hot path",loop:"per-token loop",branch:"alternate route",backend:"backend alternative",startup:"startup"}[e.k])}</code>`,ev.clientX,ev.clientY);
});
hitsG.addEventListener("pointerout",ev=>{ const e=ev.target.__e; if(!e) return; e.tx=0;e.ty=0;kick(); hideTip(); restoreLit(); });
function restoreLit(){ if(sel) litNode(byId[sel]); else clearLit(); }

/* ---------------- filters + search ---------------- */
const KINDS=[{k:"hot",label:"Hot path",col:"var(--hot)"},{k:"branch",label:"Alternates",col:"#8a95a5"},{k:"backend",label:"Other backends",col:"var(--c-model)"},{k:"startup",label:"Startup",col:"var(--startup)"}];
const shown=new Set(KINDS.map(x=>x.k));
const chips=$("#chips");
KINDS.forEach(K=>{
  const b=document.createElement("button"); b.className="chip"; b.setAttribute("aria-pressed","true");
  b.innerHTML=`<i style="background:${K.col}"></i>${K.label}<span class="n">${N.filter(n=>n.k===K.k).length}</span>`;
  b.onclick=()=>{ shown.has(K.k)?shown.delete(K.k):shown.add(K.k); b.setAttribute("aria-pressed",shown.has(K.k)); applyFilters(); };
  chips.appendChild(b);
});
function applyFilters(){
  N.forEach(n=>n.el.hidden=!shown.has(n.k));
  edges.forEach(e=>{ const h=byId[e.a].el.hidden||byId[e.b].el.hidden; e.el.style.display=e.hit.style.display=h?"none":""; if(e.glow) e.glow.style.display=h?"none":""; if(e.lab) e.lab.style.display=h?"none":""; });
  document.querySelectorAll(".band").forEach(b=>b.hidden=!shown.has("startup"));
  drawMini();
}
const q=$("#q"), qcount=$("#qcount");
let hits=[];
q.addEventListener("input",()=>{
  const s=q.value.trim().toLowerCase();
  N.forEach(n=>n.el.classList.remove("hit"));
  if(!s){ canvas.classList.remove("searching"); qcount.textContent=""; hits=[]; return; }
  hits=N.filter(n=>[n.t,n.fn,n.n,n.d,n.f?F[n.f]||"":"",...(n.c||[]).map(c=>c[0])].join(" ").toLowerCase().includes(s));
  hits.forEach(n=>n.el.classList.add("hit")); canvas.classList.add("searching");
  qcount.textContent=hits.length?`${hits.length}`:"none";
});
let hitCursor=0;
q.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"&&hits.length){ const n=hits[hitCursor++%hits.length]; if(n.el.hidden){ shown.add(n.k); syncChips(); applyFilters(); } select(n.id,true); }
  if(ev.key==="Escape"){ q.value=""; q.dispatchEvent(new Event("input")); q.blur(); }
});
function syncChips(){ [...chips.children].forEach((b,i)=>b.setAttribute("aria-pressed",shown.has(KINDS[i].k))); }

/* ---------------- inspector ---------------- */
let sel=null;
function select(id,fly){
  if(sel) byId[sel].el.classList.remove("sel");
  sel=id;
  if(!id){ clearLit(); renderEmpty(); return; }
  const n=byId[id]; n.el.classList.add("sel"); litNode(n);
  renderInspector(n);
  if(fly) centerOn(n);
  insp.classList.remove("closed");
}
function jumpBtn(id,via){
  const n=byId[id]; const hot=n.k==="hot";
  return `<button class="jump${hot?" hot":""}" data-jump="${id}" style="--lc:${lcVar(n)}"><i></i>${esc(n.t)}${via?` <em>${esc(via)}</em>`:""}</button>`;
}
function renderInspector(n, narration){
  const L=laneOf(n);
  const hi=hotIndex[n.id];
  const prev=hi>1?HOTSEQ[hi-2]:null, next=hi&&hi<HOTSEQ.length?HOTSEQ[hi]:null;
  const ins=n.ins.map(e=>jumpBtn(e.a, e.k==="loop"?"loop":e.k!=="hot"?KTAG[byId[e.a].k]:"")).join("");
  const outs=n.outs.map(e=>jumpBtn(e.b, e.k==="loop"?"loop":e.k!=="hot"?KTAG[byId[e.b].k]:"")).join("");
  insp.style.setProperty("--lc",lcVar(n));
  insp.innerHTML=`
    <button class="ibtn closeinsp" data-close aria-label="Close inspector">✕</button>
    ${narration?`<div class="narr"><span class="k">${esc(narration.k)}</span><p>${esc(narration.text)}</p></div>`:""}
    <div>
      <div class="eyebrow"><i></i>${esc(L.name)} · ${hi?`hot path step ${hi} of ${HOTSEQ.length}`:esc(KTAG[n.k])}</div>
      <h2 style="margin-top:6px">${esc(n.t)}</h2>
      <div class="fnline">${esc(n.fn)}</div>
      ${n.f?`<a class="src" href="${srcURL(n.f,n.l)}" target="_blank" rel="noopener">${esc(srcLabel(n.f,n.l))} ↗</a>`:""}
    </div>
    <p>${esc(n.d)}</p>
    ${n.p?`<div class="sec"><h3>On this request</h3><pre class="payload">${n.p}</pre></div>`:""}
    ${n.c&&n.c.length?`<div class="sec"><h3>Key calls</h3><ul class="calls">${n.c.map(([lab,f,l])=>`<li><span>${esc(lab)}</span><a href="${srcURL(f,l)}" target="_blank" rel="noopener">${esc((F[f]||"").split("/").pop())}:${l}</a></li>`).join("")}</ul></div>`:""}
    ${ins?`<div class="sec"><h3>Comes from</h3><div class="jumps">${ins}</div></div>`:""}
    ${outs?`<div class="sec"><h3>Goes to</h3><div class="jumps">${outs}</div></div>`:""}
    ${hi?`<div class="navrow"><button class="ibtn" data-jump="${prev||""}" ${prev?"":"disabled"}>◀ ${prev?esc(byId[prev].t):"start"}</button><button class="ibtn" data-jump="${next||""}" ${next?"":"disabled"}>${next?esc(byId[next].t):"end"} ▶</button></div>`:""}
  `;
}
function renderEmpty(){
  insp.style.removeProperty("--lc");
  insp.innerHTML=`<div class="empty">
    <div class="eyebrow">vllm serve · ${N.length} nodes · ${edges.length} connections</div>
    <h2>Follow one chat request through vLLM</h2>
    <p>The amber cables are the path a streaming <code style="font-family:var(--mono);font-size:12px">/v1/chat/completions</code> request takes on one NVIDIA GPU. It starts in the API process (HTTP, chat template, tokenizer), crosses ZMQ into the engine core process (scheduler, paged KV cache, GPU forward pass, sampling), then crosses back to be detokenized and streamed as server-sent events. The purple cables are the per-token loop, and the dashed lines are the two process boundaries.</p>
    <ol>
      <li>Press <b>▶ Trace</b> below, or step with <span class="kbd">←</span> <span class="kbd">→</span>. Set the pace with <b>Speed</b>, or press <span class="kbd">[</span> <span class="kbd">]</span>. The thin bar under the step name fills until the next step.</li>
      <li>Click any node for what it does, sample data at that point, and links to the exact source lines.</li>
      <li>Hover cables and nodes to see connections. Drag nodes to untangle, drag the background to pan, scroll or pinch to zoom.</li>
    </ol>
    <div class="sec"><h3>Start here</h3><div class="jumps">${["client","stepq","sched","prep","sampler","detok"].map(id=>jumpBtn(id)).join("")}</div></div>
    <p style="font-size:12px;color:var(--fg-3)">Source lines are pinned to commit 1388100 (Oct 4 2026). Assumed setup: <code style="font-family:var(--mono)">vllm serve meta-llama/Llama-3.1-8B-Instruct</code> on one H100 with defaults, which means Model Runner V2, async scheduling, FlashAttention, FULL_AND_PIECEWISE CUDA graphs, prefix caching and chunked prefill. Token ids, probabilities and block numbers in the samples are illustrative.</p>
  </div>`;
}
insp.addEventListener("click",ev=>{
  const j=ev.target.closest("[data-jump]"); if(j&&j.dataset.jump){ const n=byId[j.dataset.jump]; if(n.el.hidden){ shown.add(n.k); syncChips(); applyFilters(); } select(j.dataset.jump,true); return; }
  if(ev.target.closest("[data-close]")){ insp.classList.add("closed"); }
});

/* ---------------- trace ---------------- */
let ti=-1, playing=false, playTimer=0;
/* playback speed: 1× is the original pace (2.3 s per step). Slower speeds also slow the packet and camera. */
const SPEEDS=[0.25,0.5,0.75,1,1.5,2];
const BASE_DWELL=2300;
let speed=0.5;
try{ const s=parseFloat(localStorage.getItem("vllm-tracer-speed")); if(SPEEDS.includes(s)) speed=s; }catch(e){}
const tSpeed=document.getElementById("tSpeed"), tDwell=document.getElementById("tDwell");
SPEEDS.forEach(s=>{ const o=document.createElement("option"); o.value=s; o.textContent=`${s}× · ${(BASE_DWELL/s/1000).toFixed(1)}s`; tSpeed.appendChild(o); });
tSpeed.value=String(speed);
const dwellMs=()=>BASE_DWELL/speed;
function setSpeed(s){
  speed=s; tSpeed.value=String(s);
  try{ localStorage.setItem("vllm-tracer-speed",String(s)); }catch(e){}
  if(playing){ clearTimeout(playTimer); scheduleNext(); }
}
tSpeed.addEventListener("change",()=>{ setSpeed(parseFloat(tSpeed.value)); tSpeed.blur(); });
function startDwell(ms){
  tDwell.style.transition="none"; tDwell.style.width="0"; void tDwell.offsetWidth;
  if(ms){ tDwell.style.transition=`width ${ms}ms linear`; tDwell.style.width="100%"; }
}
function scheduleNext(){ const ms=dwellMs(); startDwell(ms); playTimer=setTimeout(tick, ms); }
const tProg=$("#tProg"), tStep=$("#tStep"), tName=$("#tName"), tPlay=$("#tPlay");
function stepInfo(i){ const s=TRACE[i]; return Array.isArray(s)?{id:s[0],say:s[1]}:{id:s,say:null}; }
function clearTrace(){ N.forEach(n=>n.el.classList.remove("cur","visited")); edges.forEach(e=>e.el.classList.remove("trav")); packet.setAttribute("cx",-100); packet.setAttribute("cy",-100); }
function gotoStep(i){
  i=Math.max(0,Math.min(TRACE.length-1,i)); const prevI=ti; ti=i;
  clearTrace();
  ["hot"].forEach(k=>{ if(!shown.has(k)){ shown.add(k); syncChips(); applyFilters(); } });
  for(let j=0;j<=i;j++){ const {id}=stepInfo(j); byId[id].el.classList.add("visited"); if(j>0){ const e=edgeByKey[stepInfo(j-1).id+">"+id]; if(e) e.el.classList.add("trav"); } }
  const {id,say}=stepInfo(i), n=byId[id]; n.el.classList.add("cur");
  if(n.el.hidden){ shown.add(n.k); syncChips(); applyFilters(); }
  const loopPhase = i>=HOTSEQ.length;
  tStep.textContent = loopPhase ? `STEP ${i+1}/${TRACE.length} · GENERATION LOOP` : `STEP ${i+1}/${TRACE.length} · FIRST TOKEN`;
  tName.textContent = n.t+" — "+n.fn;
  tProg.style.width=((i+1)/TRACE.length*100)+"%";
  if(sel) byId[sel].el.classList.remove("sel"); sel=id; n.el.classList.add("sel"); litNode(n);
  renderInspector(n, {k: loopPhase?`TRACE · LOOP STEP ${i+1}`:`TRACE · STEP ${i+1}`, text: say || n.n});
  insp.classList.remove("closed");
  if($("#tFollow").checked){ const v=viewRect(), k=Math.max(cam.k,0.8); flyTo(v.w/2-(n.x+W/2)*k, v.h/2-(n.y+n.h/2)*k-30, k, Math.min(1400, 520/Math.min(1,speed))); }
  // packet along the edge we just traversed
  if(prevI>=0 && Math.abs(i-prevI)===1){
    const a=stepInfo(Math.min(i,prevI)).id, b=stepInfo(Math.max(i,prevI)).id, e=edgeByKey[a+">"+b];
    if(e && !reduced) animatePacket(e, i<prevI);
  }
}
let pktRaf=0;
function animatePacket(e,rev){
  cancelAnimationFrame(pktRaf); const L=e.el.getTotalLength(), t0=performance.now(), ms=Math.min(900,280+L*0.35)/Math.min(1,speed);
  const f=now=>{ const p=Math.min(1,(now-t0)/ms), q=rev?1-p:p, pt=e.el.getPointAtLength(L*q); packet.setAttribute("cx",pt.x); packet.setAttribute("cy",pt.y); if(p<1) pktRaf=requestAnimationFrame(f); else { packet.setAttribute("cx",-100); packet.setAttribute("cy",-100);} };
  pktRaf=requestAnimationFrame(f);
}
function setPlaying(p){ playing=p; tPlay.textContent=p?"❚❚ Pause":(ti>=0?"▶ Play":"▶ Trace"); clearTimeout(playTimer); if(p) scheduleNext(); else startDwell(0); }
function tick(){ if(!playing) return; if(ti>=TRACE.length-1){ setPlaying(false); return; } gotoStep(ti+1); if(ti>=TRACE.length-1){ setPlaying(false); return; } scheduleNext(); }
tPlay.onclick=()=>{ if(playing){ setPlaying(false); return; } gotoStep(ti<0||ti>=TRACE.length-1 ? 0 : ti+1); setPlaying(true); };
$("#tNext").onclick=()=>{ setPlaying(false); gotoStep(ti+1); };
$("#tPrev").onclick=()=>{ setPlaying(false); gotoStep(ti<0?0:ti-1); };
$("#tFirst").onclick=()=>{ setPlaying(false); gotoStep(0); };
document.addEventListener("keydown",ev=>{
  if(ev.target.matches("input,textarea")) { return; }
  if(ev.key==="ArrowRight"){ ev.preventDefault(); setPlaying(false); gotoStep(ti+1); }
  else if(ev.key==="ArrowLeft"){ ev.preventDefault(); setPlaying(false); gotoStep(ti<0?0:ti-1); }
  else if(ev.key===" " && !ev.target.closest("button")){ ev.preventDefault(); tPlay.click(); }
  else if(ev.key==="["||ev.key==="]"){ const i=SPEEDS.indexOf(speed)+(ev.key==="]"?1:-1); if(i>=0&&i<SPEEDS.length) setSpeed(SPEEDS[i]); }
  else if(ev.key==="f"||ev.key==="F"){ fitNodes(visibleNodes(),1); }
  else if(ev.key==="/"){ ev.preventDefault(); q.focus(); }
  else if(ev.key==="Escape"){ setPlaying(false); select(null); clearTrace(); ti=-1; tStep.textContent="TRACE A REQUEST"; tName.textContent="Press ▶ to follow one chat request end to end"; tProg.style.width="0"; tPlay.textContent="▶ Trace"; }
  else if(ev.key==="Enter" && ev.target.classList.contains("node")){ select(ev.target.dataset.id,true); }
});

/* ---------------- minimap ---------------- */
const mini=$("#mini"); let mb=null; const laneColor={}; LANES.forEach(L=>laneColor[L.c]=getComputedStyle(document.documentElement).getPropertyValue(L.c).trim());
function drawMini(){
  if(!mini.getBoundingClientRect().width) return;
  const vis=visibleNodes(); if(!vis.length){ mini.innerHTML=""; return; }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; N.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+W);y1=Math.max(y1,n.y+n.h);});
  const pad=8, s=Math.min((190-pad*2)/(x1-x0),(104-pad*2)/(y1-y0)); mb={x0,y0,s,pad};
  const v=viewRect();
  const vx=(-cam.x/cam.k-x0)*s+pad, vy=(-cam.y/cam.k-y0)*s+pad, vw=v.w/cam.k*s, vh=v.h/cam.k*s;
  mini.innerHTML = vis.map(n=>`<rect x="${(n.x-x0)*s+pad}" y="${(n.y-y0)*s+pad}" width="${W*s}" height="${Math.max(2,n.h*s)}" rx="1" fill="${n.k==="hot"?"#ffb547":laneColor[laneOf(n).c]}" opacity="${n.k==="hot"?.85:.45}"/>`).join("")
    + `<rect class="v" x="${vx}" y="${vy}" width="${vw}" height="${vh}" rx="2"/>`;
}
mini.addEventListener("pointerdown",ev=>{
  ev.stopPropagation(); if(!mb) return; const r=mini.getBoundingClientRect(), v=viewRect();
  const wx=(ev.clientX-r.left-mb.pad)/mb.s+mb.x0, wy=(ev.clientY-r.top-mb.pad)/mb.s+mb.y0;
  flyTo(v.w/2-wx*cam.k, v.h/2-wy*cam.k, cam.k, 300);
});

/* ---------------- boot ---------------- */
function sizeWires(){ let x1=0,y1=0; N.forEach(n=>{x1=Math.max(x1,n.x+W);y1=Math.max(y1,n.y+n.h)}); wires.setAttribute("width",x1+400); wires.setAttribute("height",y1+800); }
sizeWires(); renderEmpty();
requestAnimationFrame(()=>{ fitNodes(N.filter(n=>n.col<=4 && n.row<=6),0.95); });
addEventListener("resize",()=>drawMini());
if(innerWidth<=860) insp.classList.add("closed");
</script>
</body>
</html>
