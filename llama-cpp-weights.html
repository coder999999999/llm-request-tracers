<style>
/* Same dark palette and type as the tracers. Layout: top bar, the weight tape, two panels, bottom transport. */
:root{
  color-scheme: dark;
  --bg:#0a0d11; --bg-2:#0f1318; --panel:#12161c; --panel-2:#171c23; --line:#232a33; --line-2:#2e3742;
  --fg:#d8dee7; --fg-2:#9aa5b4; --fg-3:#647083;
  --hot:#ffb547; --hot-dim:rgba(255,181,71,.16);
  --q4:#64a0f2; --q6:#9286ee; --f32:#8b96a8; --cpu:#f08a5d; --act:#9cc65b;
  --sans:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--sans);margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
a{color:var(--q4)}
.app{min-height:100%;display:grid;grid-template-rows:auto auto 1fr;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:9px 16px;padding-top:calc(9px + env(safe-area-inset-top,0px));background:var(--bg-2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-weight:700;font-size:15px;letter-spacing:.01em}
.brand span{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.brand a{color:var(--fg-3);text-decoration:none;border-bottom:1px dotted var(--line-2)}
.home{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 7px;border:1px solid var(--line-2);border-radius:6px;color:var(--fg-2);text-decoration:none;font-size:12px;white-space:nowrap;flex:none}
.home:hover{color:var(--fg);border-color:var(--fg-3)}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 11px;font-size:12px;color:var(--fg-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--hot-dim);color:var(--hot)}
.seg button:hover{color:var(--fg)}
.ibtn{border:1px solid var(--line-2);background:var(--panel);border-radius:6px;height:28px;min-width:28px;padding:0 8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--fg-2);text-decoration:none}
.ibtn:hover{color:var(--fg);border-color:var(--fg-3)}
.ibtn.primary{border-color:rgba(255,181,71,.5);color:var(--hot);background:var(--hot-dim)}
.ibtn:disabled{opacity:.4;cursor:default}

/* the tape */
.tapewrap{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.tapehead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:8px}
.tapehead h1{margin:0;font-size:17px;font-weight:700}
.tapehead .sum{font:12px var(--mono);color:var(--fg-2)}
.tapehead .key{display:flex;gap:14px;font-size:12px;color:var(--fg-2)}
.tapehead .key i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.tape{display:block;width:100%;height:132px}
.tape .blk{stroke:var(--bg);stroke-width:.6;cursor:pointer;transition:opacity .15s}
.tape .blk.q4{fill:var(--q4)}.tape .blk.q6{fill:var(--q6)}.tape .blk.f32{fill:var(--f32)}.tape .blk.cpu{fill:var(--cpu)}
.tape.dim .blk:not(.on){opacity:.28}
.tape .blk.on{stroke:#fff3dc;stroke-width:1.5}
.tape .blk.done{opacity:.55}
.tape .sec{font:600 10px var(--sans);letter-spacing:.1em;text-transform:uppercase;fill:var(--fg-3)}
.tape .sub{font:10px var(--mono);fill:var(--fg-3)}
.tape .lbl{font:10.5px var(--mono);fill:var(--fg);pointer-events:none;paint-order:stroke;stroke:var(--bg-2);stroke-width:3px}
.tape .head{fill:none;stroke:#fff3dc;stroke-width:2;filter:drop-shadow(0 0 5px var(--hot))}
.tape .headdot{fill:#fff3dc;filter:drop-shadow(0 0 6px var(--hot))}
.tape .readbar{fill:var(--hot);opacity:.9}
.tape .readtrack{fill:var(--line)}
.tape .timebar{fill:var(--act);opacity:.9}
.tape .headlbl{font:600 10.5px var(--mono);fill:#fff3dc;paint-order:stroke;stroke:var(--bg-2);stroke-width:3px}
.strip{display:flex;flex-wrap:wrap;gap:3px 2px;align-items:center;margin-top:6px}
.strip .chip{font:11.5px var(--mono);white-space:pre;padding:2px 5px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg-2);transition:opacity .15s}
.strip .chip.sp{color:var(--fg-3);font-size:10px}
.strip .chip.word{color:var(--fg);border-color:var(--line-2)}
.strip.dim .chip:not(.on){opacity:.4}
.strip .chip.on{color:#1a1206;background:var(--hot);border-color:var(--hot);opacity:1}
.strip .stripnote{font-size:11.5px;color:var(--fg-3);margin-left:8px}

/* panels */
.main{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:0;min-height:0}
.panel{padding:18px 20px 24px;min-width:0}
.panel+.panel{border-left:1px solid var(--line)}
.panel h2{margin:0 0 4px;font-size:20px;line-height:1.15;font-weight:700;text-wrap:balance}
.panel h3{margin:18px 0 8px;font:600 10.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3)}
.panel p{margin:0 0 8px;color:var(--fg-2);font-size:13.5px;line-height:1.55;max-width:60ch}
.panel p.lead{color:var(--fg);font-size:14.5px}
.step-k{font:600 10.5px var(--mono);color:var(--hot);letter-spacing:.04em;margin-bottom:6px}
.fnline{font:12px var(--mono);color:#c3cdda;word-break:break-word;margin:4px 0 8px}
.src{display:inline-flex;gap:6px;align-items:center;font:11.5px var(--mono);color:var(--q4);text-decoration:none;word-break:break-all}
.src:hover{text-decoration:underline}
.phnote{border-left:2px solid var(--hot);padding-left:10px}
.meas{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:13px;color:var(--fg-2);max-width:52ch}
.meas b{font:500 13px var(--mono);color:var(--fg);font-variant-numeric:tabular-nums;text-align:right;word-break:break-word}
.meas .sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 2px;max-width:48ch}
.prog b{display:block;height:100%;background:var(--hot);transition:width .4s}
.tcard{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:10px 12px;max-width:48ch}
.tcard .nm{font:500 13px var(--mono);color:var(--fg);word-break:break-all}
.tcard .ty{font:11px var(--mono);color:var(--fg-3);margin-top:2px}
.vals{overflow:auto;border:1px solid var(--line);border-radius:6px;background:#080a0d}
table.v{border-collapse:collapse;font:11.5px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.v th{font:600 10px var(--sans);letter-spacing:.06em;color:var(--fg-3);padding:5px 8px;text-align:right;background:var(--panel-2);position:sticky;top:0}
table.v th:first-child{text-align:left}
table.v td{padding:4px 8px;text-align:right;color:#e9d5b0;border-top:1px solid var(--line)}
table.v td.rl{text-align:left;color:var(--fg-2)}
table.v td.gap{color:var(--fg-3);text-align:center}
table.v td.neg{color:#9fc0ea}
table.v caption{caption-side:top;text-align:left;font:11px var(--mono);color:var(--fg-3);padding:6px 8px;border-bottom:1px solid var(--line)}
table.v td.rl b{font-weight:500;color:var(--fg)}
table.v th .th2{display:block;font:500 10px var(--mono);color:var(--fg-3)}
.dimtxt{color:var(--fg-3)}
.colnote{font-size:12px;color:var(--fg-3);margin-top:6px;max-width:70ch}
.changed{font:12px var(--mono);color:var(--fg-2);margin-top:4px}
.tokc{font-family:var(--mono);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-right:4px}
.sumline{font:12px var(--mono);color:var(--fg-2);margin-top:8px}
.prompt{margin:0;background:#080a0d;border:1px solid var(--line);border-left:2px solid var(--cpu);border-radius:5px;padding:9px 10px;font:11.5px/1.5 var(--mono);color:#e9d5b0;white-space:pre-wrap;word-break:break-word;max-width:60ch}
.kbd{font:10.5px var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--fg-2)}
.note{font-size:12px;color:var(--fg-3);max-width:60ch}

/* transport */
.transport{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(15,19,24,.96);border:1px solid var(--line-2);border-radius:10px;padding:7px 9px 7px 12px;box-shadow:0 12px 34px rgba(0,0,0,.5);z-index:4;max-width:calc(100% - 32px);box-sizing:border-box}
.transport .lbl{display:grid;min-width:0;width:340px}
.transport .lbl small{font:600 10px var(--mono);color:var(--hot);letter-spacing:.05em}
.transport .lbl span{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transport .pg{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.transport .pg b{display:block;height:100%;background:var(--hot);width:0;transition:width .3s}
.transport .ibtn{height:30px;min-width:30px}

@media (max-width: 900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .panel+.panel{border-left:0;border-top:1px solid var(--line)}
  .transport .lbl{width:160px}
  .tape{height:118px}
  .brand .wide{display:none}
}
@media (prefers-reduced-motion: reduce){ .prog b,.transport .pg b{transition:none} }
</style>
</head>

    const rt = rowTokens(idx.length, ph);
    const pick = idx.length === 1 ? [0] : [0, idx.length - 1];
    body = colHeads(n0, blocksArr[idx[0]].find(r => r !== null));
    pick.forEach((p, pi) => {
      const blk = blocksArr[idx[p]]; const nrows = blk.filter(r => r !== null).length;
      shownTokens.add(rt[p]);
      body += `<tr><td class="rl" colspan="8">${tokLabel(rt[p], ph)}</td></tr>`;
      let ri = 0; blk.forEach(r => { if (r === null) body += rowHTML(null); else { const hi = ri < 3 ? ri : n1 - (nrows - ri); body += rowHTML(`head ${hi}`, r, max); ri++; } });
      if (pi < pick.length - 1) body += rowHTML(null);
    });
    cols = `columns are dimension 0 to ${int(n0 - 1)} within one head; rows are the ${int(n1)} heads`;
  } else {
    // [features × rows]: rows are tokens, or cache cells; after the last-layer trim a single row, the last token
    const rows = v.data, nr = rowsOf(rows); const isCache = key === "cache_k" || key === "cache_v";
    body = colHeads(n0, rows.find(r => r !== null));
    const rt = nr === 1 && ph === "prefill" ? [nTok(ph) - 1] : rowTokens(nr, ph);
    let ri = 0; rows.forEach(r => { if (r === null) body += rowHTML(null); else {
      let lab;
      if (isCache) { const c = ri < 3 ? ri : n1 - (nr - ri); lab = `cell ${int(c)}${c < nTok(ph) ? ` <span class="dimtxt">${esc(vis(tokensOf(ph)[c].piece))}</span>` : ` <span class="dimtxt">empty</span>`}`; if (c < nTok(ph)) shownTokens.add(c); }
      else { lab = tokLabel(rt[ri], ph) + (nr === 1 && ph === "prefill" ? ` <span class="dimtxt">the only row left</span>` : ""); shownTokens.add(rt[ri]); }
      body += rowHTML(lab, r, max); ri++; } });
    const what = key === "logits" ? "" : isCache ? `the stored ${key === "cache_k" ? "key" : "value"}` : n0 === 14336 ? "the feed-forward width" : n0 === 1024 ? `${key === "k" || key === "k_rope" ? "8 key heads" : "8 value heads"} of 128` : "the residual stream, 32 heads of 128 when attention looks at it";
    cols = `columns are feature 0 to ${int(n0 - 1)} of ${what}; the first three and the last three are printed${isCache ? `; rows are the ${int(n1)} cache cells of this layer, one per token` : ""}`;
  }
  // what changed
  let changed = "";
  const from = (FROM[key] || []).map(k => VALS[ph][k]).filter(Boolean);
  if (from.length) {
    const ins = (FROM[key] || []).filter(k => VALS[ph][k]).map(k => `${esc(TITLE[k].split(",")[0])} (sum ${fmtSum(VALS[ph][k].sum)})`).join(" and ");
    changed = `<div class="changed">From ${ins}: ${int(nVals(from[0]))} values in, ${int(nVals(v))} out, sum ${fmtSum(v.sum)}.</div>`;
  } else changed = `<div class="changed">${int(nVals(v))} values, sum ${fmtSum(v.sum)}.</div>`;
  return `<div class="vals"><table class="v"><caption>${esc(TITLE[key] || key)} · ${dims}</caption>${body}</table></div><div class="colnote">${esc(cols)}.${note ? " " + note : ""}</div>${changed}`;
}
function renderVals(i) {
  const s = STEPS[i], ph = phase, el = $("#vals");
  let html = "";
  shownTokens = new Set();
  if (s.id === "tok") {
    html = `<h3>${ph === "decode" ? "The token" : ph === "bare" ? "The bare prompt" : "The prompt, as the model saw it"}</h3>` + (ph === "decode"
      ? `<p>The one-token pass in the log starts from <code style="font-family:var(--mono)">&lt;|begin_of_text|&gt;</code> alone. In the real reply, each decode step starts from the token sampled in the step before: "The", then " sky", " appears", " blue".</p>`
      : ph === "bare"
      ? `<pre class="prompt">${esc(MEASURED.bare.text)}</pre><p class="note">${nTok(ph)} tokens with the leading &lt;|begin_of_text|&gt;, no chat template. The log printer keeps the first three and last three rows of every tensor, so with 7 tokens the rows are "Why", " is" and " sky", " blue", "?": only " the" is omitted.</p>`
      : `<pre class="prompt">${esc(MEASURED.prompt.text)}</pre><p class="note">${MEASURED.promptTokens} tokens with the leading &lt;|begin_of_text|&gt; the tokenizer adds; the strip above shows each one. The chat template put the date in a system header, so the question is tokens 31 to 36, and the printed rows of each tensor are template tokens. The bare-prompt pass, at the top, puts the words in the rows.</p>`);
    wordsOf(ph).forEach(x => shownTokens.add(x));
  } else if (s.id === "next") {
    html = `<h3>What the scores became</h3><p>${MEASURED.prompt.reply.map(t => `<code class="tokc">${esc(t)}</code>`).join("")}</p><p>The first word came from the prompt pass; each word after it from one more decode step over the whole tape. ${int(M.decode.steps)} steps in this reply.</p>`;
    shownTokens.add(ph === "decode" ? 0 : nTok(ph) - 1);
  } else {
    html = `<h3>What came out, real values</h3>` + s.values.map(k => valuesHTML(k, ph)).join("<div style=\"height:14px\"></div>");
    html += `<p class="note" style="margin-top:12px">Values and sums as llama-eval-callback printed them for this ${ph === "decode" ? "one-token pass" : "pass"}: the corners of each tensor, with the middle omitted. ${{ decode: "This decode-shaped pass ran on <|begin_of_text|> alone, so these are not the reply's values; the timings are from the real reply.", bare: "This pass ran the same model on the bare question, on the CPU, so that the words are in the printed rows. It is not the profiled request, and CPU kernels differ from the GPU's in the last digits.", prefill: "This is the real prompt pass of the profiled run. The highlighted tokens in the strip above are the rows shown." }[ph]}</p>`;
  }
  el.innerHTML = html;
  markTokens([...shownTokens]);
}

/* ---------------- steps and transport ---------------- */
const tProg = $("#tProg"), tStep = $("#tStep"), tName = $("#tName"), tPlay = $("#tPlay");
let headState = null;
function gotoStep(i, opts = {}) {
  i = Math.max(0, Math.min(STEPS.length - 1, i)); const prev = ti; ti = i;
  const s = STEPS[i], ph = phase;
  renderNow(i); renderVals(i);
  const bl = stepBlocks(s);
  const us = elapsedUs(i, ph);
  const from = opts.noAnim || prev !== i - 1 ? null : headState;
  if (s.sweep) { markBlocks(gpuBlocks.filter(b => b.layer > 0), null); headState = { off: outStart, us }; setHead(headState, from || { off: layerBytes(0), us: elapsedUs(i - 1, ph) }, true); }
  else if (bl.length && bl[0].sec !== "cpu") { const end = bl[bl.length - 1].before + bl[bl.length - 1].b; markBlocks(bl, bl[0].before); headState = { off: end, us }; setHead(headState, from, false); }
  else if (bl.length) { markBlocks(bl, 0); hideHead(); headState = { off: 0, us: 0 }; }
  else { // activation-only step: keep the head where the last read left it
    const lastRead = [...STEPS.slice(0, i)].reverse().find(x => stepBlocks(x).some(b => b.sec !== "cpu") || x.sweep);
    if (lastRead) { const off = lastRead.sweep ? outStart : (b => b.before + b.b)(stepBlocks(lastRead).at(-1)); markBlocks([], off); headState = { off: s.id === "next" ? TAPE.gpuBytes : off, us }; setHead(headState, from, false); }
    else { markBlocks([], null); hideHead(); headState = { off: 0, us: 0 }; }
  }
  tStep.textContent = `STEP ${i + 1}/${STEPS.length} · ${PHNAME[phase].toUpperCase()}`;
  tName.textContent = `${s.t}: ${s.fn}`;
  tProg.style.width = ((i + 1) / STEPS.length * 100) + "%";
  if (!opts.keepScroll && innerWidth <= 900) $("#now").scrollIntoView({ behavior: "smooth", block: "start" });
}
function renderIntro() {
  drawStrip(); markTokens(wordsOf(phase));
  $("#barkey").textContent = tape.__narrow ? "bytes, time" : "bytes read, then kernel time";
  $("#now").innerHTML = `
    <div class="step-k">LLAMA 3.1 8B Q4_K_M · ${int(TAPE.layers.length)} LAYERS · ${int(gpuBlocks.length)} TENSORS ON THE GPU</div>
    <h2>One token, 4.4 GB of weights, in order</h2>
    <p class="lead">Generating one token means reading every weight of the model once. The strip above is all of them, laid out in the order a pass reads them: the embedding table on the CPU, then 32 layers of nine matrices each, then the output head. Under it, the prompt as the model saw it.</p>
    <p>Press <b>▶ Trace</b> and the playhead walks the tape. At each step the left panel shows the matrix being read, its format, size and measured speed; the right panel shows the real numbers that came out of that step for the highlighted tokens, and the two bars under the tape count bytes and time.</p>
    <p>Layer 0 is drawn wider so its matrices can be told apart. Layers 1 to 31 are drawn to the same scale as each other. Click any block to jump to its step.</p>
    <h3>Measured</h3>
    <div class="meas"><span>Decode step, GPU busy</span><b>${fmtUs(M.decode.busyMedianUs)}, median of ${M.decode.steps}</b><span>Prompt pass, 41 tokens</span><b>${fmtUs(M.prefill.busyUs)}</b><span>Bytes per decode step</span><b>${int(MiB(TAPE.gpuBytes))} MiB</b><span>Effective bandwidth</span><b>${int(TAPE.gpuBytes / (M.decode.busyMedianUs * 1000))} GB/s of ${int(MEASURED.peakGBps)}</b><span>Tokens per second</span><b>${M.bench.tg.toFixed(1)} (llama-bench)</b></div>`;
  $("#vals").innerHTML = `
    <h3>The prompt</h3>
    <pre class="prompt">${esc(MEASURED.prompt.text)}</pre>
    <p class="note">The request was "Why is the sky blue?". The chat template wrapped it in a system header with the date, ${MEASURED.promptTokens} tokens in all. The reply began "${esc(MEASURED.prompt.reply.slice(0, 4).join(""))}".</p>
    <h3>About the values</h3>
    <p>The numbers on this page come from three runs of <span style="font-family:var(--mono);font-size:12px">llama-eval-callback</span> at the same commit, which prints the corners and the sum of every tensor in the graph: the real ${MEASURED.promptTokens}-token prompt pass of the profiled request; the same model on the bare question, 7 tokens, so that the words themselves are in the printed rows; and a one-token pass that has the shape of a decode step. Timings come from the Nsight Systems trace of the server answering the request.</p>
    <p>Switch between them with the buttons at the top. Step with <span class="kbd">←</span> <span class="kbd">→</span>, play with <span class="kbd">Space</span>.</p>
    <p class="note">Source lines are pinned to llama.cpp commit 2ca15f5 (Oct 4 2026). The op-by-op graph of the same pass is the <a href="llama-cpp-inference.html">inference tracer</a>; the write-up with charts is <a href="llama-cpp-forward.html">One forward pass</a>; where each head looks during this prompt is <a href="llama-cpp-attention.html">Attention maps</a>.</p>`;
}
function resetTrace() { ti = -1; headState = null; markBlocks([], null); hideHead(); renderIntro(); tStep.textContent = "TRACE A FORWARD PASS"; tName.textContent = "Press ▶ to read the weights one token at a time"; tProg.style.width = "0"; tPlay.textContent = "▶ Trace"; }
function setPlaying(p) { playing = p; tPlay.textContent = p ? "❚❚ Pause" : (ti >= 0 ? "▶ Play" : "▶ Trace"); clearTimeout(playTimer); if (p) playTimer = setTimeout(tick, 3400); }
function tick() { if (!playing) return; if (ti >= STEPS.length - 1) { setPlaying(false); return; } gotoStep(ti + 1); if (ti >= STEPS.length - 1) { setPlaying(false); return; } playTimer = setTimeout(tick, STEPS[ti].sweep ? 4600 : 3400); }
tPlay.onclick = () => { if (playing) { setPlaying(false); return; } gotoStep(ti < 0 || ti >= STEPS.length - 1 ? 0 : ti + 1); setPlaying(true); };
$("#tNext").onclick = () => { setPlaying(false); gotoStep(ti + 1); };
$("#tPrev").onclick = () => { setPlaying(false); gotoStep(ti < 0 ? 0 : ti - 1); };
$("#tFirst").onclick = () => { setPlaying(false); gotoStep(0); };
document.addEventListener("keydown", ev => {
  if (ev.target.matches("input,textarea")) return;
  if (ev.key === "ArrowRight") { ev.preventDefault(); setPlaying(false); gotoStep(ti + 1); }
  else if (ev.key === "ArrowLeft") { ev.preventDefault(); setPlaying(false); gotoStep(ti < 0 ? 0 : ti - 1); }
  else if (ev.key === " " && !ev.target.closest("button")) { ev.preventDefault(); tPlay.click(); }
  else if (ev.key === "Escape") { setPlaying(false); resetTrace(); }
});
const phaseBtns = [...document.querySelectorAll("#phase button")];
function setPhase(ph) { phase = ph; phaseBtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.phase === ph)); drawStrip(); if (ti >= 0) gotoStep(ti, { keepScroll: true, noAnim: true }); else renderIntro(); }
phaseBtns.forEach(b => b.onclick = () => setPhase(b.dataset.phase));

/* ---------------- boot ---------------- */
drawTape(); renderIntro();
let rsz = 0; addEventListener("resize", () => { clearTimeout(rsz); rsz = setTimeout(() => { drawTape(); if (ti >= 0) gotoStep(ti, { keepScroll: true, noAnim: true }); else $("#barkey").textContent = tape.__narrow ? "bytes, time" : "bytes read, then kernel time"; }, 120); });
</script>
</body>
