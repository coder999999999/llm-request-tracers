<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Follow the tensors through one forward pass of Llama 3.1 8B in llama.cpp, op by op, with the measured CUDA kernels and links to the exact source lines.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>llama.cpp Inference Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-bleed node canvas, top command bar, right inspector, bottom trace transport. Dark-only by request. */
:root{
  color-scheme: dark;
  --bg:#0a0d11; --bg-2:#0f1318; --panel:#12161c; --panel-2:#171c23; --line:#232a33; --line-2:#2e3742;
  --fg:#d8dee7; --fg-2:#9aa5b4; --fg-3:#647083;
  --hot:#ffb547; --hot-dim:rgba(255,181,71,.16); --loop:#b993ff; --startup:#5fb3a9; --branch:#4a5463;
  --c-client:#8b96a8; --c-http:#4cb6ac; --c-parse:#64a0f2; --c-queue:#9286ee; --c-sched:#cf86da;
  --c-llama:#f08a5d; --c-graph:#9cc65b; --c-ggml:#58c6df; --c-samp:#f17a96; --c-resp:#59cc9c;
  --sans:"IBM Plex Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.45 var(--sans);overflow:hidden;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
a{color:var(--c-parse)}

.app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr 340px}
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:9px 16px;padding-top:calc(9px + env(safe-area-inset-top,0px));background:var(--bg-2);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font-weight:700;font-size:15px;letter-spacing:.01em}
.brand span{font-family:var(--mono);font-size:11px;color:var(--fg-3)}
.brand a{color:var(--fg-3);text-decoration:none;border-bottom:1px dotted var(--line-2)}
.search{position:relative;flex:0 1 200px;min-width:160px}
.search input{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 52px 6px 28px;color:var(--fg);font:12px var(--mono)}
.search input::placeholder{color:var(--fg-3)}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);fill:var(--fg-3)}
.search .count{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--fg-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;cursor:pointer;color:var(--fg-2);user-select:none}
.chip i{width:8px;height:8px;border-radius:50%;display:block}
.chip[aria-pressed="true"]{color:var(--fg);border-color:var(--fg-3);background:var(--panel-2)}
.chip[aria-pressed="false"] i{opacity:.3}
.chip .n{font:10px var(--mono);color:var(--fg-3)}
.spacer{flex:1}
.zoomctl{display:flex;align-items:center;gap:4px}
.ibtn{border:1px solid var(--line-2);background:var(--panel);border-radius:6px;height:28px;min-width:28px;padding:0 8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--fg-2)}
.ibtn:hover{color:var(--fg);border-color:var(--fg-3)}
.ibtn.primary{border-color:rgba(255,181,71,.5);color:var(--hot);background:var(--hot-dim)}
.zoomctl .pct{font:11px var(--mono);color:var(--fg-3);width:42px;text-align:center}

/* canvas */
.canvas{position:relative;overflow:hidden;cursor:grab;touch-action:none;background-color:var(--bg);
  background-image:radial-gradient(circle,#1d232c 1.1px,transparent 1.2px)}
.canvas.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.wires .hit{pointer-events:stroke;stroke:transparent;stroke-width:14;fill:none;cursor:pointer}
.wire{fill:none;stroke-width:1.6;transition:opacity .18s,stroke-width .12s}
.wire.k-branch{stroke:var(--branch);stroke-dasharray:4 4}
.wire.k-backend{stroke:#35505a;stroke-dasharray:2 4}
.wire.k-startup{stroke:var(--startup);opacity:.55;stroke-dasharray:6 4}
.wire.k-loop{stroke:var(--loop);stroke-dasharray:7 5;stroke-width:1.8}
.wire.k-hot{stroke:var(--hot);stroke-width:2.2;opacity:.85}
.wire.k-hot.flow{stroke-dasharray:10 8;animation:flow 1.1s linear infinite}
.glow{fill:none;stroke:var(--hot);stroke-width:7;opacity:.10;filter:blur(3px);pointer-events:none}
@keyframes flow{to{stroke-dashoffset:-36}}
.wire.lit{stroke-width:3.2;opacity:1}
.wire.k-branch.lit,.wire.k-backend.lit{stroke:#8b97a8}
.wire.k-startup.lit{opacity:1}
.wlabel{font:10.5px var(--mono);fill:var(--fg-3);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.wlabel.k-loop{fill:var(--loop)}
.wlabel.k-hot{fill:#c99245}
.dim-wires .wire:not(.lit),.dim-wires .glow{opacity:.1}
.dim-wires .wlabel:not(.lit){opacity:.15}
.trav{stroke:#fff3dc!important;opacity:1!important}
.packet{fill:#fff3dc;filter:drop-shadow(0 0 6px var(--hot))}

.lane-h{position:absolute;font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;padding-bottom:6px;border-bottom:1px solid var(--line);width:244px;display:flex;justify-content:space-between}
.lane-h small{font:10px var(--mono);letter-spacing:0;text-transform:none;color:var(--fg-3)}
.band{position:absolute;border:1px dashed #22413e;border-radius:10px;background:rgba(95,179,169,.03)}
.band span{position:absolute;left:12px;top:-9px;padding:0 6px;background:var(--bg);font:600 10px var(--sans);letter-spacing:.14em;color:var(--startup);text-transform:uppercase}

.node{position:absolute;width:244px;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:7px;cursor:pointer;user-select:none;transition:opacity .18s,border-color .15s,box-shadow .15s;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.node .hd{display:flex;align-items:center;gap:7px;padding:6px 9px 5px;border-bottom:1px solid var(--line);border-radius:7px 7px 0 0;position:relative}
.node .hd::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;border-radius:7px 7px 0 0;background:var(--lc)}
.node .tt{font-weight:600;font-size:13px;line-height:1.2;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .bd{padding:6px 9px 8px;display:grid;gap:2px}
.node .fn{font:11px/1.35 var(--mono);color:#c3cdda;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .loc{font:10px var(--mono);color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .tag{font:9.5px var(--mono);padding:1px 5px;border-radius:3px;border:1px solid var(--line-2);color:var(--fg-3);white-space:nowrap}
.node.k-hot .tag{color:var(--hot);border-color:rgba(255,181,71,.4)}
.node.k-startup .tag{color:var(--startup);border-color:rgba(95,179,169,.4)}
.node .step{font:600 10px var(--mono);color:#1a1206;background:var(--hot);border-radius:3px;padding:0 4px;min-width:14px;text-align:center}
.node .port{position:absolute;top:24px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--lc);box-sizing:border-box}
.node .port.in{left:-5px}.node .port.out{right:-5px}
.node.k-hot{border-color:#3a3226}
.node.k-branch,.node.k-backend{background:#10141a}
.node.k-branch .tt,.node.k-backend .tt{color:var(--fg-2)}
.node:hover{border-color:var(--fg-3)}
.node.sel{border-color:var(--hot);box-shadow:0 0 0 1px var(--hot),0 0 26px rgba(255,181,71,.22)}
.node.cur{border-color:#fff3dc;box-shadow:0 0 0 2px #fff3dc,0 0 34px rgba(255,181,71,.45)}
.node.visited{border-color:#6b5532}
.dim-nodes .node:not(.lit){opacity:.28}
.searching .node:not(.hit){opacity:.18}
.searching .node.hit{border-color:var(--c-parse)}
.node.dragging{cursor:grabbing;box-shadow:0 14px 30px rgba(0,0,0,.55);z-index:3}

.tip{position:fixed;z-index:20;max-width:300px;background:#0c0f14;border:1px solid var(--line-2);border-radius:7px;padding:9px 11px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:12.5px;color:var(--fg)}
.tip b{display:block;font-size:12px;margin-bottom:3px;color:var(--hot)}
.tip code{font:11px var(--mono);color:var(--fg-2)}

/* inspector */
.insp{background:var(--bg-2);border-left:1px solid var(--line);overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px;z-index:4}
.insp h2{margin:0;font-size:19px;line-height:1.15;font-weight:700;text-wrap:balance}
.insp .eyebrow{display:flex;gap:8px;align-items:center;font:600 10.5px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
.insp .eyebrow i{width:8px;height:8px;border-radius:2px;background:var(--lc)}
.insp .fnline{font:12px var(--mono);color:#c3cdda;word-break:break-word;margin-top:6px}
.insp .src{display:inline-flex;gap:6px;align-items:center;font:11.5px var(--mono);margin-top:6px;color:var(--c-parse);text-decoration:none;word-break:break-all}
.insp .src:hover{text-decoration:underline}
.insp p{margin:0;color:var(--fg-2);font-size:13.5px;line-height:1.55;max-width:62ch}
.sec{display:grid;gap:7px}
.sec > h3{margin:0;font:600 10.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3)}
.payload{margin:0;background:#080a0d;border:1px solid var(--line);border-left:2px solid var(--hot);border-radius:5px;padding:9px 10px;font:11px/1.5 var(--mono);color:#e9d5b0;white-space:pre-wrap;word-break:break-word;overflow-x:auto}
.payload .c{color:var(--fg-3)}
.calls{list-style:none;margin:0;padding:0;display:grid;gap:1px;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.calls li{background:var(--panel);padding:6px 9px;display:flex;flex-direction:column;gap:1px}
.calls li span{font:11px var(--mono);color:#c3cdda;min-width:0;word-break:break-word}
.calls li a{font:10.5px var(--mono);color:var(--fg-3);white-space:nowrap;text-decoration:none}
.calls li a:hover{color:var(--c-parse)}
.jumps{display:flex;flex-wrap:wrap;gap:5px}
.jump{border:1px solid var(--line-2);background:var(--panel);border-radius:5px;padding:4px 8px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--fg-2);text-align:left}
.jump:hover{color:var(--fg);border-color:var(--fg-3)}
.jump i{width:6px;height:6px;border-radius:50%;background:var(--lc);flex:none}
.jump.hot{border-color:rgba(255,181,71,.35);color:var(--fg)}
.jump em{font-style:normal;font:10px var(--mono);color:var(--fg-3)}
.navrow{display:flex;gap:6px}
.navrow .ibtn{flex:1}
.narr{border:1px solid rgba(255,181,71,.35);background:linear-gradient(180deg,rgba(255,181,71,.08),transparent);border-radius:7px;padding:10px 12px;display:grid;gap:5px}
.narr .k{font:600 10.5px var(--mono);color:var(--hot);letter-spacing:.04em}
.narr p{color:var(--fg)}
.empty{color:var(--fg-2);display:grid;gap:12px}
.empty ol{margin:0;padding-left:18px;display:grid;gap:6px}
.kbd{font:10.5px var(--mono);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--fg-2)}
.closeinsp{display:none}
.tip .ex{display:block;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--fg-2);font-size:12px}
.tip .ex i{font-style:normal;font:600 10px var(--mono);color:var(--c-parse);letter-spacing:.04em;margin-right:4px}
.tip .hint{display:block;margin-top:6px;font:10.5px var(--mono);color:var(--fg-3)}
.card{position:absolute;z-index:4;width:310px;box-sizing:border-box;background:#0d1116;border:1px solid rgba(255,181,71,.55);border-radius:9px;box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 0 4px rgba(255,181,71,.06);padding:11px 12px 10px;display:grid;gap:8px}
.card .top{display:flex;align-items:center;gap:8px}
.card .top small{font:600 10px var(--mono);color:var(--hot);letter-spacing:.05em;flex:1}
.card .x{border:0;background:none;color:var(--fg-3);cursor:pointer;font-size:14px;padding:0 2px;line-height:1}
.card .x:hover{color:var(--fg)}
.card h4{margin:0;font-size:15px;line-height:1.2;text-wrap:balance}
.card .fnc{font:10.5px var(--mono);color:var(--fg-3);margin-top:2px;word-break:break-word}
.card p{margin:0;font-size:13px;line-height:1.5;color:var(--fg)}
.card .ex{font-size:12px;color:var(--fg-2);background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:6px 8px;line-height:1.45}
.card .ex b{font:600 10px var(--mono);color:var(--c-parse);letter-spacing:.04em;margin-right:4px}
.card .ex code{font:11px var(--mono);color:#c3cdda}
.card .row{display:flex;gap:6px;align-items:center}
.card .row .ibtn{height:30px}
.card .row .grow{flex:1}
.card .more{font-size:11.5px;color:var(--fg-3);background:none;border:0;cursor:pointer;padding:0;text-decoration:underline dotted}
.card .more:hover{color:var(--fg)}
.card::before{content:"";position:absolute;width:10px;height:10px;background:#0d1116;border-left:1px solid rgba(255,181,71,.55);border-bottom:1px solid rgba(255,181,71,.55);top:18px;left:-6px;transform:rotate(45deg)}
.card.right::before{left:auto;right:-6px;transform:rotate(-135deg)}
.card.below::before,.card.docked::before{display:none}
@media (max-width:860px){ .card.docked{left:12px!important;right:12px;top:auto!important;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:auto} }

/* transport */
.transport{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(15,19,24,.94);border:1px solid var(--line-2);border-radius:10px;padding:7px 9px 7px 12px;box-shadow:0 12px 34px rgba(0,0,0,.5);z-index:4;max-width:calc(100% - 32px);box-sizing:border-box}
.transport .lbl{display:grid;min-width:0;width:300px}
.transport .lbl small{font:600 10px var(--mono);color:var(--hot);letter-spacing:.05em}
.transport .lbl span{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transport .prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:4px}
.transport .prog b{display:block;height:100%;background:var(--hot);width:0;transition:width .3s}
.transport .ibtn{height:30px;min-width:30px}
.transport label{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--fg-2);white-space:nowrap;cursor:pointer}
.transport input{accent-color:var(--hot)}

.legend{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:5px;background:rgba(15,19,24,.92);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:11.5px;color:var(--fg-2);z-index:3}
.legend div{display:flex;align-items:center;gap:8px}
.legend svg{flex:none}
.mini{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:rgba(15,19,24,.92);border:1px solid var(--line);border-radius:8px;z-index:3;cursor:pointer}
.mini rect.v{fill:rgba(255,181,71,.07);stroke:var(--hot);stroke-width:1}

@media (max-width: 1100px){ .legend{display:none} }
@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .insp{position:fixed;left:0;right:0;bottom:0;max-height:52%;border-left:0;border-top:1px solid var(--line);border-radius:12px 12px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.5)}
  .insp.closed{display:none}
  .closeinsp{display:inline-flex;position:absolute;right:12px;top:12px}
  .mini{display:none}
  .transport .lbl{width:150px}
  .transport label{display:none}
  .search{flex:1 1 100%}
}
@media (prefers-reduced-motion: reduce){ .wire.k-hot.flow{animation:none} .node,.wire{transition:none} }
</style>
<style>
/* Back link and forward-pass additions: phase switch, measured time on each node, kernel table. */
.home{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 7px;border:1px solid var(--line-2);border-radius:6px;color:var(--fg-2);text-decoration:none;font-size:12px;white-space:nowrap;flex:none}
.home:hover{color:var(--fg);border-color:var(--fg-3)}
.home svg{flex:none}
.empty{grid-template-columns:minmax(0,1fr)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:5px 11px;font-size:12px;color:var(--fg-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--hot-dim);color:var(--hot)}
.seg button:hover{color:var(--fg)}
.node .ms{display:flex;align-items:center;gap:6px;font:10.5px var(--mono);color:var(--fg-2);white-space:nowrap}
.node .ms .bar{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.node .ms .bar b{display:block;height:100%;background:var(--lc)}
.node .ms.cpu{color:var(--fg-3)}
.ktab{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:5px;overflow:hidden;font:11px/1.4 var(--mono)}
.ktab th{text-align:left;font:600 10px var(--sans);letter-spacing:.06em;color:var(--fg-3);padding:5px 8px;background:var(--panel-2)}
.ktab td{padding:5px 8px;border-top:1px solid var(--line);color:#c3cdda;vertical-align:top;word-break:break-word}
.ktab td.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--fg)}
.ktab td.g{white-space:nowrap;color:var(--fg-3)}
.ktab tr.help td{color:var(--fg-3)}
.ktab tfoot td{color:var(--fg-2);background:var(--panel)}
.meas{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;color:var(--fg-2)}
.meas b{font:500 13px var(--mono);color:var(--fg);font-variant-numeric:tabular-nums;text-align:right}
.refs{list-style:none;margin:0;padding:0;display:grid;gap:1px;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.refs li{background:var(--panel);padding:6px 9px;display:grid;gap:2px}
.refs li span{font-size:12.5px;color:var(--fg-2)}
.refs li a{font:10.5px var(--mono);color:var(--fg-3);text-decoration:none;word-break:break-all}
.refs li a:hover{color:var(--c-parse)}
.phnote{border-left:2px solid var(--lc);padding-left:10px}
@media (max-width: 860px){ .seg button{padding:5px 8px} .brand .wide{display:none} }
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <a class="home" href="tracers.html" title="Back to all tracers"><svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 3 2 8l5 5M2.5 8H14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>All tracers</a>
    <div class="brand"><b>llama.cpp</b><span>inference tracer · <a id="commitlink" href="https://github.com/ggml-org/llama.cpp/tree/2ca15f5404760548c39e7b92bd43116a09414a1a" target="_blank" rel="noopener">2ca15f5</a><span class="wide"> · Llama 3.1 8B Q4_K_M · RTX 4090</span></span></div>
    <div class="seg" id="phase" role="group" aria-label="Which forward pass">
      <button data-phase="decode" aria-pressed="true" title="One generated token, replayed as a CUDA graph">Decode step</button>
      <button data-phase="prefill" aria-pressed="false" title="The 41-token prompt, launched kernel by kernel">Prompt pass</button>

  if(e.label){ const t=document.createElementNS(SVGNS,"text"); t.setAttribute("class",`wlabel k-${e.k}`); t.setAttribute("text-anchor","middle"); t.textContent=labelText(e); labelsG.appendChild(t); e.lab=t; }
});

function geom(e){
  const A=byId[e.a], B=byId[e.b];
  const sx=A.x+W, sy=A.y+PORTY, tx=B.x, ty=B.y+PORTY;
  let c1x,c1y,c2x,c2y;
  if (tx > sx + 30) { const dx=Math.max(55,(tx-sx)*0.45); c1x=sx+dx;c1y=sy;c2x=tx-dx;c2y=ty; }
  else if (A.col===B.col) { c1x=sx+85;c1y=sy;c2x=tx-85;c2y=ty; }
  else { const d=Math.hypot(sx-tx,sy-ty); const drop=170+d*0.22; c1x=sx+260;c1y=Math.max(sy,ty)+drop;c2x=tx-260;c2y=Math.max(sy,ty)+drop; }
  c1x+=e.ox;c1y+=e.oy;c2x+=e.ox;c2y+=e.oy;
  return {sx,sy,c1x,c1y,c2x,c2y,tx,ty};
}
function drawEdge(e){
  const g=geom(e), d=`M${g.sx},${g.sy} C${g.c1x},${g.c1y} ${g.c2x},${g.c2y} ${g.tx},${g.ty}`;
  e.el.setAttribute("d",d); e.hit.setAttribute("d",d); if(e.glow) e.glow.setAttribute("d",d);
  if(e.lab){ const t=.5,m=1-t; const x=m*m*m*g.sx+3*m*m*t*g.c1x+3*m*t*t*g.c2x+t*t*t*g.tx, y=m*m*m*g.sy+3*m*m*t*g.c1y+3*m*t*t*g.c2y+t*t*t*g.ty; e.lab.setAttribute("x",x); e.lab.setAttribute("y",y-6); }
  e.mid = bez(g,.5);
}
const bez=(g,t)=>{const m=1-t;return{x:m*m*m*g.sx+3*m*m*t*g.c1x+3*m*t*t*g.c2x+t*t*t*g.tx,y:m*m*m*g.sy+3*m*m*t*g.c1y+3*m*t*t*g.c2y+t*t*t*g.ty}};
edges.forEach(drawEdge);

/* ---------------- spring physics on hovered cables ---------------- */
let springing=false;
function kick(){ if(!springing){ springing=true; requestAnimationFrame(stepSprings); } }
function stepSprings(){
  let active=false;
  for(const e of edges){
    const fx=(e.tx-e.ox)*0.14, fy=(e.ty-e.oy)*0.14;
    e.vx=(e.vx+fx)*0.74; e.vy=(e.vy+fy)*0.74; e.ox+=e.vx; e.oy+=e.vy;
    if(Math.abs(e.vx)+Math.abs(e.vy)+Math.abs(e.tx-e.ox)+Math.abs(e.ty-e.oy)>0.05){ active=true; drawEdge(e); }
    else if(e.ox!==e.tx||e.oy!==e.ty){ e.ox=e.tx;e.oy=e.ty;e.vx=e.vy=0;drawEdge(e); }
  }
  if(active) requestAnimationFrame(stepSprings); else springing=false;
}
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- camera ---------------- */
const cam={x:0,y:0,k:1};
function applyCam(){
  world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.k})`;
  const gs=22*cam.k; canvas.style.backgroundSize=`${gs}px ${gs}px`; canvas.style.backgroundPosition=`${cam.x}px ${cam.y}px`;
  $("#pct").textContent=Math.round(cam.k*100)+"%";
  labelsG.style.display = cam.k<0.45 ? "none":"";
  drawMini(); placeCard();
}
const clampK=k=>Math.min(2.2,Math.max(0.18,k));
function zoomAt(px,py,k){ k=clampK(k); const wx=(px-cam.x)/cam.k, wy=(py-cam.y)/cam.k; cam.k=k; cam.x=px-wx*k; cam.y=py-wy*k; applyCam(); }
let flyRaf=0;
function flyTo(tx,ty,tk,ms=520){
  cancelAnimationFrame(flyRaf);
  if(reduced){ Object.assign(cam,{x:tx,y:ty,k:tk}); applyCam(); return; }
  const s={...cam}, t0=performance.now();
  const f=now=>{ const p=Math.min(1,(now-t0)/ms), q=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    cam.x=s.x+(tx-s.x)*q; cam.y=s.y+(ty-s.y)*q; cam.k=s.k+(tk-s.k)*q; applyCam(); if(p<1) flyRaf=requestAnimationFrame(f); };
  flyRaf=requestAnimationFrame(f);
}
function viewRect(){ const r=canvas.getBoundingClientRect(); return {w:r.width,h:r.height,l:r.left,t:r.top}; }
function fitBox(x0,y0,x1,y1,pad=60,maxK=1.1){
  const v=viewRect(); const bw=x1-x0, bh=y1-y0;
  const k=clampK(Math.min((v.w-pad*2)/bw,(v.h-pad*2-70)/bh,maxK));
  flyTo((v.w-bw*k)/2-x0*k, (v.h-70-bh*k)/2-y0*k+10, k);
}
function visibleNodes(){ return N.filter(n=>!n.el.hidden); }
function fitNodes(list,maxK){ if(!list.length) return; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; list.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+W);y1=Math.max(y1,n.y+n.h);}); fitBox(x0,y0-50,x1,y1,50,maxK); }
function centerOn(n,k){ const v=viewRect(); k=k??Math.max(cam.k,0.85); flyTo(v.w/2-(n.x+W/2)*k, v.h/2-(n.y+n.h/2)*k-30, k); }

/* ---------------- interaction: pan / zoom / drag ---------------- */
let drag=null; const pointers=new Map(); let pinch=null;
canvas.addEventListener("pointerdown",ev=>{
  if(ev.target.closest(".transport,.legend,.mini")) return;
  pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pointers.size===2){ const [a,b]=[...pointers.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:cam.k}; drag=null; return; }
  const nodeEl=ev.target.closest(".node");
  if(nodeEl){ const n=byId[nodeEl.dataset.id]; drag={type:"node",n,sx:ev.clientX,sy:ev.clientY,nx:n.x,ny:n.y,moved:false}; }
  else drag={type:"pan",sx:ev.clientX,sy:ev.clientY,cx:cam.x,cy:cam.y,moved:false,edge:ev.target.__e||null};
  canvas.setPointerCapture(ev.pointerId);
});
canvas.addEventListener("pointermove",ev=>{
  if(pointers.has(ev.pointerId)) pointers.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pinch && pointers.size===2){ const [a,b]=[...pointers.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const v=viewRect(); zoomAt((a.x+b.x)/2-v.l,(a.y+b.y)/2-v.t,pinch.k*d/pinch.d); return; }
  if(!drag) return;
  const dx=ev.clientX-drag.sx, dy=ev.clientY-drag.sy;
  if(!drag.moved && Math.hypot(dx,dy)>4){ drag.moved=true; if(drag.type==="pan") canvas.classList.add("panning"); else { drag.n.el.classList.add("dragging"); hideTip(); } }
  if(!drag.moved) return;
  if(drag.type==="pan"){ cam.x=drag.cx+dx; cam.y=drag.cy+dy; applyCam(); }
  else { const n=drag.n; n.x=drag.nx+dx/cam.k; n.y=drag.ny+dy/cam.k; n.el.style.left=n.x+"px"; n.el.style.top=n.y+"px"; [...n.ins,...n.outs].forEach(drawEdge); drawMini(); placeCard(); }
});
function endPtr(ev){
  pointers.delete(ev.pointerId); if(pointers.size<2) pinch=null;
  if(!drag) return;
  if(!drag.moved && drag.type==="node") select(drag.n.id,false);
  else if(!drag.moved && drag.type==="pan" && ev.type==="pointerup") { if(drag.edge) select(drag.edge.b,true); else if(sel) select(null); }
  if(drag.type==="node") drag.n.el.classList.remove("dragging");
  canvas.classList.remove("panning"); drag=null;
}
canvas.addEventListener("pointerup",endPtr); canvas.addEventListener("pointercancel",endPtr);
canvas.addEventListener("wheel",ev=>{
  ev.preventDefault(); const v=viewRect();
  const wheelLike = ev.deltaMode!==0 || (ev.deltaX===0 && Math.abs(ev.deltaY)>=50);
  if((ev.ctrlKey||ev.metaKey||wheelLike) && !ev.shiftKey){
    zoomAt(ev.clientX-v.l, ev.clientY-v.t, cam.k*Math.exp(-ev.deltaY*(ev.ctrlKey?0.012:0.0018)));
  } else { cam.x-=ev.deltaX; cam.y-=ev.deltaY; applyCam(); }
},{passive:false});

let ti=-1, playing=false, playTimer=0;
const tProg=$("#tProg"), tStep=$("#tStep"), tName=$("#tName"), tPlay=$("#tPlay");
function stepInfo(i){ const s=TRACE[i]; if(!Array.isArray(s)) return {id:s,say:null}; return {id:s[0],say:typeof s[1]==="function"?s[1](phase):s[1]}; }
const loopPhaseAt = i => i>=12 && i<14 ? "LAYERS 1 TO 31" : i===TRACE.length-1 ? "NEXT TOKEN" : (i<12?"LAYER 0":"OUTPUT");
function narration(i){ const {id,say}=stepInfo(i); return {k:`TRACE · STEP ${i+1} · ${loopPhaseAt(i)}`, text: say || byId[id].n}; }
function clearTrace(){ N.forEach(n=>n.el.classList.remove("cur","visited")); edges.forEach(e=>e.el.classList.remove("trav")); packet.setAttribute("cx",-99999); packet.setAttribute("cy",-99999); }
function resetTrace(){ ti=-1; clearTrace(); tStep.textContent="TRACE A FORWARD PASS"; tName.textContent="Press ▶ to follow one token through the model"; tProg.style.width="0"; tPlay.textContent="▶ Trace"; }
function stepLabel(){ if(ti>=0) tStep.textContent = `STEP ${ti+1}/${TRACE.length} · ${loopPhaseAt(ti)} · ${PHNAME[phase].toUpperCase()}`; }
function gotoStep(i){
  i=Math.max(0,Math.min(TRACE.length-1,i)); const prevI=ti; ti=i;
  clearTrace();
  for(let j=0;j<=i;j++){ const {id}=stepInfo(j); byId[id].el.classList.add("visited"); if(j>0){ const e=edgeByKey[stepInfo(j-1).id+">"+id]; if(e) e.el.classList.add("trav"); } }
  const {id}=stepInfo(i), n=byId[id]; n.el.classList.add("cur");
  stepLabel();
  tName.textContent = n.t+": "+n.fn;
  tProg.style.width=((i+1)/TRACE.length*100)+"%";
  if(sel) byId[sel].el.classList.remove("sel"); sel=id; n.el.classList.add("sel"); litNode(n);
  renderInspector(n, narration(i));
  if(innerWidth>860) insp.classList.remove("closed");
  cardOff=false; renderCard();
  if($("#tFollow").checked) centerOn(n, Math.max(cam.k, 0.8));
  if(prevI>=0 && Math.abs(i-prevI)===1){
    const a=stepInfo(Math.min(i,prevI)).id, b=stepInfo(Math.max(i,prevI)).id, e=edgeByKey[a+">"+b];
    if(e && !reduced) animatePacket(e, i<prevI);
  }
}
let pktRaf=0;
function animatePacket(e,rev){
  cancelAnimationFrame(pktRaf); const L=e.el.getTotalLength(), t0=performance.now(), ms=Math.min(900,280+L*0.35);
  const f=now=>{ const p=Math.min(1,(now-t0)/ms), q=rev?1-p:p, pt=e.el.getPointAtLength(L*q); packet.setAttribute("cx",pt.x); packet.setAttribute("cy",pt.y); if(p<1) pktRaf=requestAnimationFrame(f); else { packet.setAttribute("cx",-99999); packet.setAttribute("cy",-99999);} };
  pktRaf=requestAnimationFrame(f);
}
function setPlaying(p){ playing=p; tPlay.textContent=p?"❚❚ Pause":(ti>=0?"▶ Play":"▶ Trace"); clearTimeout(playTimer); if(p) playTimer=setTimeout(tick,2300); }
function tick(){ if(!playing) return; if(ti>=TRACE.length-1){ setPlaying(false); return; } gotoStep(ti+1); if(ti>=TRACE.length-1){ setPlaying(false); return; } playTimer=setTimeout(tick, 2300); }
tPlay.onclick=()=>{ if(playing){ setPlaying(false); return; } gotoStep(ti<0||ti>=TRACE.length-1 ? 0 : ti+1); setPlaying(true); };
$("#tNext").onclick=()=>{ setPlaying(false); gotoStep(ti+1); };
$("#tPrev").onclick=()=>{ setPlaying(false); gotoStep(ti<0?0:ti-1); };
$("#tFirst").onclick=()=>{ setPlaying(false); gotoStep(0); };
document.addEventListener("keydown",ev=>{
  if(ev.target.matches("input,textarea")) { return; }
  if(ev.key==="ArrowRight"){ ev.preventDefault(); setPlaying(false); gotoStep(ti+1); }
  else if(ev.key==="ArrowLeft"){ ev.preventDefault(); setPlaying(false); gotoStep(ti<0?0:ti-1); }
  else if(ev.key===" " && !ev.target.closest("button")){ ev.preventDefault(); tPlay.click(); }
  else if(ev.key==="f"||ev.key==="F"){ fitNodes(visibleNodes(),1); }
  else if(ev.key==="/"){ ev.preventDefault(); q.focus(); }
  else if(ev.key==="Escape"){ setPlaying(false); card.hidden=true; select(null); resetTrace(); }
  else if(ev.key==="Enter" && ev.target.classList.contains("node")){ select(ev.target.dataset.id,true); }
});

/* ---------------- step card (popup next to the node) ---------------- */
const card=$("#card"); let cardOff=false;
function cardModel(){
  if(cardOff||!sel) return null;
  const n=byId[sel];
  if(ti>=0 && stepInfo(ti).id===sel){
    const nar=narration(ti);
    return {n, label:`STEP ${ti+1} / ${TRACE.length} · ${loopPhaseAt(ti)}`, text:nar.text,
      prev: ti>0 ? ()=>gotoStep(ti-1) : null, next: ti<TRACE.length-1 ? ()=>gotoStep(ti+1) : null,
      nextLabel: ti<TRACE.length-1 ? byId[stepInfo(ti+1).id].t : null};
  }
  const hi=hotIndex[sel]; if(!hi) return null;
  return {n, label:`STEP ${hi} / ${HOTSEQ.length}`, text:n.n,
    prev: hi>1 ? ()=>gotoStep(hi-2) : null, next: ()=>gotoStep(Math.min(hi, TRACE.length-1)),
    nextLabel: byId[stepInfo(Math.min(hi, TRACE.length-1)).id].t};
}
let cardNav={};
function renderCard(){
  const m=cardModel(); if(!m){ card.hidden=true; return; }
  cardNav=m;
  const t=opTime(m.n,phase);
  card.innerHTML=`<div class="top"><small>${esc(m.label)}</small><button class="x" data-card="close" aria-label="Hide step popup" title="Hide (shows again on next step)">✕</button></div>
    <div><h4>${esc(m.n.t)}</h4><div class="fnc">${esc(m.n.fn)}${t?` · ${esc(fmtUs(t.us))} in the ${esc(PHNAME[phase])}`:""}</div></div>
    <p>${esc(m.text)}</p>
    ${m.n.ex?`<div class="ex"><b>E.G.</b>${m.n.ex}</div>`:""}
    <div class="row"><button class="ibtn" data-card="prev" ${m.prev?"":"disabled"} aria-label="Previous step">◀</button>
      <button class="ibtn primary grow" data-card="next" ${m.next?"":"disabled"}>${m.next?`Next: ${esc(m.nextLabel)} ▶`:"End of trace"}</button></div>
    <button class="more" data-card="more">Kernels, tensor shapes and source links →</button>`;
  card.hidden=false; placeCard();
}
function placeCard(){
  if(card.hidden||!sel) return;
  const n=byId[sel], v=viewRect(), cw=card.offsetWidth, ch=card.offsetHeight;
  card.classList.remove("right","below","docked");
  if(innerWidth<=860){ card.classList.add("docked"); return; }
  const nx=cam.x+n.x*cam.k, ny=cam.y+n.y*cam.k, nw=W*cam.k, nh=n.h*cam.k;
  let x=nx+nw+14, y=ny-4;
  if(x+cw>v.w-12){ x=nx-cw-14; card.classList.add("right"); }
  if(x<12){ x=Math.min(Math.max(12,nx),v.w-cw-12); y=ny+nh+12; card.classList.add("below"); card.classList.remove("right"); }
  y=Math.max(12,Math.min(y,v.h-ch-86));
  card.style.left=x+"px"; card.style.top=y+"px";
}
card.addEventListener("pointerdown",ev=>ev.stopPropagation());
card.addEventListener("wheel",ev=>ev.stopPropagation());
card.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-card]"); if(!b||b.disabled) return;
  const a=b.dataset.card;
  if(a==="close"){ cardOff=true; card.hidden=true; }
  else if(a==="prev"&&cardNav.prev){ setPlaying(false); cardNav.prev(); }
  else if(a==="next"&&cardNav.next){ setPlaying(false); cardNav.next(); }
  else if(a==="more"){ insp.classList.remove("closed"); insp.scrollTop=0; insp.animate?.([{boxShadow:"inset 0 0 0 2px var(--hot)"},{boxShadow:"inset 0 0 0 0 transparent"}],{duration:900}); }
});

/* ---------------- minimap ---------------- */
const mini=$("#mini"); let mb=null; const laneColor={}; LANES.forEach(L=>laneColor[L.c]=getComputedStyle(document.documentElement).getPropertyValue(L.c).trim());
function drawMini(){
  if(!mini.getBoundingClientRect().width) return;
  const vis=visibleNodes(); if(!vis.length){ mini.innerHTML=""; return; }
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; N.forEach(n=>{x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+W);y1=Math.max(y1,n.y+n.h);});
  const pad=8, s=Math.min((190-pad*2)/(x1-x0),(104-pad*2)/(y1-y0)); mb={x0,y0,s,pad};
  const v=viewRect();
  const vx=(-cam.x/cam.k-x0)*s+pad, vy=(-cam.y/cam.k-y0)*s+pad, vw=v.w/cam.k*s, vh=v.h/cam.k*s;
  mini.innerHTML = vis.map(n=>`<rect x="${(n.x-x0)*s+pad}" y="${(n.y-y0)*s+pad}" width="${W*s}" height="${Math.max(2,n.h*s)}" rx="1" fill="${n.k==="hot"?"#ffb547":laneColor[laneOf(n).c]}" opacity="${n.k==="hot"?.85:.45}"/>`).join("")
    + `<rect class="v" x="${vx}" y="${vy}" width="${vw}" height="${vh}" rx="2"/>`;
}
mini.addEventListener("pointerdown",ev=>{
  ev.stopPropagation(); if(!mb) return; const r=mini.getBoundingClientRect(), v=viewRect();
  const wx=(ev.clientX-r.left-mb.pad)/mb.s+mb.x0, wy=(ev.clientY-r.top-mb.pad)/mb.s+mb.y0;
  flyTo(v.w/2-wx*cam.k, v.h/2-wy*cam.k, cam.k, 300);
});

/* ---------------- boot ---------------- */
function sizeWires(){ let x1=0,y1=0; N.forEach(n=>{x1=Math.max(x1,n.x+W);y1=Math.max(y1,n.y+n.h)}); wires.setAttribute("width",x1+400); wires.setAttribute("height",y1+800); }
sizeWires(); renderEmpty();
requestAnimationFrame(()=>{ fitNodes(N,0.95); });
addEventListener("resize",()=>drawMini());
if(innerWidth<=860) insp.classList.add("closed");
</script>
</body>
