<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>vLLM Module Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height node-editor shell — top filter bar, pan/zoom canvas, fixed right inspector (bottom sheet on phones).
   Deliberately single dark theme: a graphite workbench where colour is reserved for domains and state. */
:root {
  color-scheme: dark;
  --bg: #0a0d12;          /* canvas ground, slight blue bias */
  --panel: #10141b;       /* chrome + cards */
  --panel-2: #151a23;     /* raised rows, inputs */
  --line: #212835;        /* hairlines */
  --line-2: #2c3546;
  --fg: #e3e8f0;
  --fg-2: #9ba6b7;
  --fg-3: #636e80;
  --accent: #8ea6ff;      /* selection + focus */
  --hot: #ff6b4a;
  --active: #d9e1ee;
  --stable: #5d6878;
  --cycle: #ff5d7a;
  --dot: #1b212c;
  --font-ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --insp: 368px;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--font-ui); overflow: hidden; }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 1.5px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0,1fr); grid-template-columns: minmax(0,1fr) var(--insp); }

/* ---------- top bar ---------- */
.bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; flex-wrap: wrap; row-gap: 8px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: 13.5px; font-weight: 600; margin: 0; letter-spacing: .01em; white-space: nowrap; }
.brand .meta { font: 11px var(--font-mono); color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.brand .meta a { text-decoration: none; color: var(--fg-2); }
.brand .meta a:hover { color: var(--fg); }
.search { position: relative; flex: 0 1 300px; min-width: 180px; }
.search input { width: 100%; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 6px 30px 6px 28px; font: 12px var(--font-mono); outline: none; }
.search input:focus { border-color: var(--accent); }
.search > svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.search kbd { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); }
kbd { font: 10px var(--font-mono); color: var(--fg-3); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--panel); }
.results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 4px; z-index: 30; box-shadow: 0 12px 30px rgba(0,0,0,.5); max-height: 320px; overflow-y: auto; }
.results button { display: flex; width: 100%; align-items: center; gap: 8px; text-align: left; background: none; border: 0; padding: 6px 8px; border-radius: 4px; cursor: pointer; font: 12px var(--font-mono); }
.results button[aria-selected="true"], .results button:hover { background: var(--panel-2); }
.results small { margin-left: auto; color: var(--fg-3); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.results .none { padding: 8px; color: var(--fg-3); font: 12px var(--font-mono); }

.filters { display: flex; align-items: center; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; }
.filters::-webkit-scrollbar { display: none; }
.grp { display: flex; align-items: center; gap: 4px; padding-right: 8px; margin-right: 2px; border-right: 1px solid var(--line); flex: none; }
.grp:last-child { border-right: 0; }
.grp-l { font: 10px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--fg-3); margin-right: 3px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 13px; border: 1px solid var(--line-2); background: transparent; font: 11.5px var(--font-ui); color: var(--fg-2); cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--fg-3); color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); border-color: #3a4558; }
.chip[aria-pressed="false"] { opacity: .5; }
.chip .lg { flex: none; color: var(--fg-2); }
.chip .lg.r { color: var(--cycle); }
.chip .n { font: 10.5px var(--font-mono); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.wt { display: flex; align-items: center; gap: 6px; font: 11px var(--font-mono); color: var(--fg-2); white-space: nowrap; }
.wt input { width: 84px; accent-color: var(--accent); }
.count { font: 11px var(--font-mono); color: var(--fg-3); white-space: nowrap; font-variant-numeric: tabular-nums; margin-left: auto; }
.count b { color: var(--fg-2); font-weight: 500; }

/* status glyphs: encoded in shape as well as colour */
.sg { width: 8px; height: 8px; flex: none; display: inline-block; border-radius: 50%; }
.sg.hot { background: var(--hot); box-shadow: 0 0 0 3px rgba(255,107,74,.18); }
.sg.active { border: 1.5px solid var(--active); }
.sg.stable { width: 8px; height: 2px; border-radius: 1px; background: var(--stable); }
.sg.dormant { border: 1.5px dashed var(--stable); }

/* ---------- canvas ---------- */
.stage { position: relative; overflow: hidden; min-width: 0; min-height: 0; cursor: grab; touch-action: none; background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1.1px, transparent 1.3px); }
.stage.panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.world svg { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
/* highlighted cables ride above faded cards; lit cards (selection + neighbours) rise above the cables */
.world svg.ovl { z-index: 2; pointer-events: none; }
.node.lit { z-index: 3; }
.cables path, .top path { fill: none; stroke-linecap: round; stroke-width: calc(var(--w) * var(--zs, 1)); }
.cables path { transition: stroke-opacity .18s; }
.k-lazy { stroke-dasharray: 7 5; }
.k-type { stroke-dasharray: 1.5 4.5; }
.cables path.hide, .hits path.hide { display: none; }
.world.focusing .cables path { stroke-opacity: .03; }
.cables path.hl { stroke-opacity: 0 !important; }
/* highlighted cables are redrawn on top: dark casing, thick core, arrowhead, count badge */
.casing path { fill: none; stroke: var(--bg); stroke-linecap: round; stroke-opacity: .9; stroke-width: calc((var(--w) * 1.15 + 4) * var(--zs, 1)); }
.top path { stroke-width: calc((var(--w) * 1.15 + 0.9) * var(--zs, 1)); stroke-opacity: .96; }
.top path.back { stroke: var(--cycle); }
.top path.k-lazy, .top path.k-type { animation: flow 1.4s linear infinite; }
.top path.hot { stroke-width: calc((var(--w) * 1.15 + 2.2) * var(--zs, 1)); stroke-opacity: 1; }
.arrows path.back { fill: var(--cycle); }
.badges circle { fill: var(--panel); stroke-width: 1.2; }
.badges text { font: 500 9.5px var(--font-mono); fill: var(--fg); text-anchor: middle; dominant-baseline: central; }
.halo { fill: none; stroke: var(--accent); stroke-opacity: .2; stroke-linecap: round; pointer-events: none; }
@keyframes flow { to { stroke-dashoffset: 24; } }
.hits path { fill: none; stroke: transparent; stroke-width: 9; pointer-events: stroke; cursor: pointer; }
.world.far .hits path { stroke-width: 14; }

.col-l { position: absolute; font: 10px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); white-space: nowrap; pointer-events: none; }
.col-l b { color: var(--fg-2); font-weight: 500; }

.node { position: absolute; width: 212px; height: 68px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 5px; padding: 8px 10px 0; cursor: pointer; user-select: none; display: grid; grid-template-rows: auto auto 1fr; gap: 5px; transition: opacity .18s, border-color .15s, box-shadow .15s; }
.node:hover { border-color: #46526a; }
.node .nh { display: flex; align-items: center; gap: 7px; min-width: 0; }
.node .nl { font: 12px var(--font-mono); color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.node .nl b { color: var(--fg); font-weight: 500; }
.node .dm { width: 7px; height: 7px; border-radius: 1.5px; flex: none; background: var(--c); }
.node .nm { display: flex; gap: 10px; font: 10.5px var(--font-mono); color: var(--fg-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.node .nm span b { color: var(--fg-2); font-weight: 400; }
.node .nb { align-self: end; height: 2px; margin: 0 -10px; background: var(--line); border-radius: 0 0 4px 4px; overflow: hidden; }
.node .nb i { display: block; height: 100%; background: var(--stable); }
.node.st-hot .nb i { background: var(--hot); }
.node.st-active .nb i { background: var(--active); opacity: .7; }
.node .port { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line-2); top: 50%; margin-top: -3px; }
.node .port.i { left: -3px; } .node .port.o { right: -3px; }
.world.focusing .node:not(.lit) { border-color: var(--line); }
.world.focusing .node:not(.lit) > * { opacity: .22; }
.node.focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(142,166,255,.16), 0 10px 30px rgba(0,0,0,.45); z-index: 4; }
.node.lit:not(.focus) { border-color: #3d4860; }
.world.searching .node:not(.match) > * { opacity: .16; }
.world.searching .node:not(.match) { border-color: var(--line); }
.node.match { border-color: var(--accent); }
.node.off { opacity: .07 !important; pointer-events: none; }
.node.dragging { cursor: grabbing; z-index: 5; box-shadow: 0 16px 40px rgba(0,0,0,.6); }
.world.far .node .nm, .world.far .node .nb { visibility: hidden; }
.world.far .node .nl { font-size: 17px; }

/* canvas overlays */
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; z-index: 5; }
.zoom button { width: 32px; height: 30px; border: 0; background: none; cursor: pointer; color: var(--fg-2); display: grid; place-items: center; font: 11px var(--font-mono); }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom button:hover { background: var(--panel-2); color: var(--fg); }
.mini { position: absolute; left: 12px; bottom: 12px; width: 200px; height: 118px; background: rgba(16,20,27,.92); border: 1px solid var(--line-2); border-radius: 6px; z-index: 5; cursor: crosshair; }
.mini canvas { width: 100%; height: 100%; display: block; }
.axis { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font: 10px var(--font-mono); color: var(--fg-3); letter-spacing: .08em; text-transform: uppercase; pointer-events: none; white-space: nowrap; z-index: 4; background: rgba(10,13,18,.8); padding: 3px 8px; border-radius: 3px; }
.tip { position: fixed; z-index: 40; pointer-events: none; background: #0d1117; border: 1px solid var(--line-2); border-radius: 5px; padding: 6px 9px; font: 11.5px var(--font-mono); color: var(--fg-2); box-shadow: 0 8px 24px rgba(0,0,0,.5); max-width: 340px; }
.tip b { color: var(--fg); font-weight: 500; }
.tip .k { color: var(--fg-3); }

/* ---------- inspector ---------- */
.insp { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; min-width: 0; min-height: 0; overscroll-behavior: contain; }
.insp-h { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 8px; z-index: 2; }
.insp-h .crumb { font: 10px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); flex: 1; }
.ib { background: none; border: 1px solid var(--line-2); border-radius: 4px; color: var(--fg-2); font: 11px var(--font-mono); padding: 3px 8px; cursor: pointer; }
.ib:hover { color: var(--fg); border-color: var(--fg-3); }
.ib[disabled] { opacity: .35; cursor: default; }
.sec { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sec h3 { margin: 0 0 10px; font: 10px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); font-weight: 400; display: flex; align-items: center; gap: 8px; }
.sec h3 .n { color: var(--fg-2); }
.sec h3 .r { margin-left: auto; text-transform: none; letter-spacing: 0; }
.title { font: 500 15px var(--font-mono); word-break: break-all; margin: 0 0 8px; color: var(--fg); text-wrap: balance; }
.title .pre { color: var(--fg-3); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 11px var(--font-mono); color: var(--fg-2); background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; padding: 2px 7px; text-decoration: none; }
a.pill:hover { color: var(--fg); border-color: var(--line-2); }
.pill.hot { color: var(--hot); border-color: rgba(255,107,74,.35); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.stats div { background: var(--panel); padding: 8px 10px; min-width: 0; }
.stats dt { font: 10px var(--font-mono); color: var(--fg-3); text-transform: uppercase; letter-spacing: .06em; }
.stats dd { margin: 2px 0 0; font: 500 15px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg); }
.stats dd small { font-size: 10.5px; color: var(--fg-3); font-weight: 400; }
.list { display: flex; flex-direction: column; gap: 1px; }
.row { display: grid; grid-template-columns: 8px minmax(0,1fr) 54px 34px; align-items: center; gap: 8px; padding: 4px 6px; margin: 0 -6px; border-radius: 4px; background: none; border: 0; text-align: left; cursor: pointer; font: 11.5px var(--font-mono); color: var(--fg-2); width: calc(100% + 12px); }
.row:hover { background: var(--panel-2); color: var(--fg); }
.row .dm { width: 7px; height: 7px; border-radius: 1.5px; background: var(--c); }
.row .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .lb .tag { font-size: 9.5px; color: var(--cycle); margin-left: 6px; letter-spacing: .04em; }
.row .lb .tag.t { color: var(--fg-3); }
.row .lb .tag.m { color: var(--accent); }
.note { font-size: 12px; color: var(--fg-2); margin: 10px 0 0; line-height: 1.45; }
.lnk { background: none; border: 0; padding: 0; color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.row .bar2 { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.row .bar2 i { display: block; height: 100%; background: var(--c); opacity: .8; }
.row .v { text-align: right; color: var(--fg-3); font-variant-numeric: tabular-nums; font-size: 10.5px; }
.more { margin-top: 6px; background: none; border: 0; color: var(--accent); font: 11px var(--font-mono); cursor: pointer; padding: 2px 0; }
.files a { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 10px; text-decoration: none; font: 11.5px var(--font-mono); color: var(--fg-2); padding: 3px 0; }
.files a:hover { color: var(--fg); }
.files a span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.files a span + span { color: var(--fg-3); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.cls { display: flex; flex-wrap: wrap; gap: 5px; }
.cls span { font: 11px var(--font-mono); color: var(--fg-2); background: var(--panel-2); border-radius: 3px; padding: 1px 6px; }
.commits a { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 2px 10px; text-decoration: none; padding: 5px 0; border-top: 1px solid var(--line); }
.commits a:first-child { border-top: 0; padding-top: 0; }
.commits a code { font: 11px var(--font-mono); color: var(--accent); }
.commits a span { font-size: 12px; color: var(--fg-2); line-height: 1.35; }
.commits a time { grid-column: 2; font: 10.5px var(--font-mono); color: var(--fg-3); }
.commits a:hover span { color: var(--fg); }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.legend button { display: flex; align-items: center; gap: 7px; background: none; border: 0; padding: 3px 0; cursor: pointer; font: 11.5px var(--font-ui); color: var(--fg-2); text-align: left; }
.legend button .dm { width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }
.legend button .n { margin-left: auto; font: 10.5px var(--font-mono); color: var(--fg-3); }
.legend button[aria-pressed="false"] { opacity: .35; }
.legend button:hover { color: var(--fg); }
.sbar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; margin: 4px 0 10px; }
.sbar i { display: block; }
.prose { color: var(--fg-2); font-size: 12.5px; line-height: 1.55; margin: 0; max-width: 62ch; }
.prose b { color: var(--fg); font-weight: 500; }
.help { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12px; color: var(--fg-2); align-items: center; }
.help kbd { justify-self: start; }
.edge-h { display: grid; grid-template-columns: minmax(0,1fr); gap: 6px; }
.edge-h button { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; cursor: pointer; font: 500 12.5px var(--font-mono); color: var(--fg); display: flex; align-items: center; gap: 8px; min-width: 0; }
.edge-h button span.l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.edge-h button:hover { border-color: var(--line-2); }
.edge-h .verb { font: 10px var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--fg-3); padding-left: 10px; }
.pairs a { display: block; text-decoration: none; font: 11px var(--font-mono); color: var(--fg-2); padding: 6px 0; border-top: 1px solid var(--line); word-break: break-all; }
.pairs a:first-child { border-top: 0; }
.pairs a:hover { color: var(--fg); }
.pairs a i { font-style: normal; color: var(--fg-3); }
.warn { font-size: 12px; color: var(--cycle); background: rgba(255,93,122,.07); border: 1px solid rgba(255,93,122,.25); border-radius: 5px; padding: 8px 10px; margin-top: 10px; line-height: 1.45; }

/* ---------- request trace ---------- */
.tbtn { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid rgba(142,166,255,.55); background: rgba(142,166,255,.1); color: var(--fg); font: 500 12px var(--font-ui); cursor: pointer; white-space: nowrap; flex: none; }
.tbtn:hover { background: rgba(142,166,255,.18); }
.tbtn[aria-pressed="true"] { background: var(--accent); color: #0a0d12; border-color: var(--accent); }
.world.tracing .node.lit.off { opacity: 1 !important; pointer-events: auto; }
.tb { position: absolute; top: -10px; right: 8px; display: flex; gap: 3px; z-index: 2; }
.tb span { min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--c); color: #0a0d12; font: 600 10px/18px var(--font-mono); text-align: center; box-shadow: 0 0 0 2px var(--bg); }
.tb span.cur { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c); }
.trace path { fill: none; stroke-linecap: round; }
.trace .tcas { stroke: var(--bg); stroke-opacity: .9; stroke-width: calc(8 * var(--zs, 1)); }
.trace .tline { stroke-width: calc(3.4 * var(--zs, 1)); stroke-opacity: .55; transition: stroke-opacity .2s; }
.trace .tline.dynamic { stroke-dasharray: 9 6; }
.trace .tline.return { stroke-dasharray: 1.5 6; }
.trace .tline.ipc { stroke-dasharray: 4 4; }
.trace .tline.past { stroke-opacity: .8; }
.trace .tline.cur { stroke-opacity: 1; stroke-width: calc(5 * var(--zs, 1)); }
.trace .tline.future { stroke-opacity: .28; }
.trace.overview .tline { stroke-opacity: .8; }
.trace .thit { stroke: transparent; stroke-width: calc(14 * var(--zs, 1)); pointer-events: stroke; cursor: pointer; }
.trace .tarr { stroke: none; }
.trace .tbadge circle { fill: var(--panel); stroke-width: 1.6; }
.trace .tbadge text { font: 600 10px var(--font-mono); fill: var(--fg); text-anchor: middle; dominant-baseline: central; }
.trace .tlabel { font: 500 10px var(--font-mono); letter-spacing: .08em; fill: var(--fg-2); text-anchor: middle; }
.packet { filter: drop-shadow(0 0 6px var(--pc)); fill: var(--pc); }
/* step card: a screen-space overlay so it stays readable and clickable at any zoom */

<script type="application/json" id="trace">{"title":"POST /v1/chat/completions, streaming","scenario":"One chat request with stream=true, served by `vllm serve` on a single NVIDIA GPU with defaults: Model Runner V2, async scheduling, FlashAttention, Llama as the example model.","phases":[{"id":"in","name":"API process","desc":"Parse, template, tokenize, hand off"},{"id":"core","name":"Engine core process","desc":"Queue, schedule, allocate KV cache"},{"id":"gpu","name":"GPU forward pass","desc":"Runs once per engine step"},{"id":"out","name":"Back to the client","desc":"Detokenize and stream"}],"steps":[{"phase":"in","unit":"entrypoints/openai","title":"HTTP route and chat serving","what":"FastAPI receives the POST and hands it to OpenAIServingChat. That builds the request id, turns the OpenAI fields into SamplingParams, and opens a generator on the engine client. With stream=true the route returns a StreamingResponse straight away, and tokens are written to it as they arrive.","refs":[{"label":"create_chat_completion()","file":"vllm/entrypoints/openai/chat_completion/api_router.py","line":54,"expect":"async def create_chat_completion"},{"label":"OpenAIServingChat._create_chat_completion()","file":"vllm/entrypoints/openai/chat_completion/serving.py","line":274,"expect":"async def _create_chat_completion"},{"label":"engine_client.generate(...)","file":"vllm/entrypoints/openai/chat_completion/serving.py","line":379,"expect":"self.engine_client.generate("}],"from":null,"hop":"entry","via":"HTTP POST /v1/chat/completions arrives","per":"request","data":{"in":"HTTP JSON body","out":"ChatCompletionRequest \u2192 SamplingParams"},"detail":[{"t":"The body is validated into a pydantic ChatCompletionRequest. Bad fields come back as an ErrorResponse with an HTTP error code before anything reaches the engine."},{"t":"to_sampling_params() maps OpenAI fields such as temperature, top_p, max_tokens, stop, seed and logprobs onto SamplingParams. It starts from defaults read from the model's generation_config.json.","ref":{"label":"to_sampling_params()","file":"vllm/entrypoints/openai/chat_completion/protocol.py","line":662,"expect":"def to_sampling_params"}},{"t":"stream=true sets output_kind to DELTA, so the engine emits only the new tokens each step. Non-streaming requests use FINAL_ONLY.","ref":{"label":"output_kind","file":"vllm/entrypoints/openai/chat_completion/protocol.py","line":721,"expect":"RequestOutputKind.DELTA if self.stream"}}],"knobs":[{"k":"--generation-config","d":"\"auto\" (default) loads generation_config.json for default sampling values; \"vllm\" ignores it.","ref":{"label":"ModelConfig.generation_config","file":"vllm/config/model.py","line":358,"expect":"generation_config: str = \"auto\""}},{"k":"--max-model-len","d":"Upper bound on prompt plus output tokens for every request."}]},{"phase":"in","unit":"renderers","title":"Chat template and tokenization","what":"The renderer applies the model's chat template to the messages (tools included), then tokenizes the resulting prompt. Multimodal inputs are gathered here too. The result is an engine input: prompt token ids plus any media.","refs":[{"label":"OnlineRenderer.render_chat()","file":"vllm/renderers/online_renderer.py","line":212,"expect":"async def render_chat"},{"label":"BaseRenderer.render_chat_async()","file":"vllm/renderers/base.py","line":1327,"expect":"async def render_chat_async"},{"label":"HfRenderer.render_messages_async()","file":"vllm/renderers/hf.py","line":1123,"expect":"async def render_messages_async"},{"label":"tokenize_prompts_async()","file":"vllm/renderers/base.py","line":805,"expect":"async def tokenize_prompts_async"}],"from":"entrypoints/openai","hop":"call","via":"OpenAIServingChat calls OnlineRenderer.render_chat()","per":"request","data":{"in":"messages, tools, images","out":"prompt token ids + media features"},"detail":[{"t":"BaseRenderer runs four labelled stages: convert raw inputs to prompts, tokenize, add extra keys, convert to engine inputs.","ref":{"label":"# Step 1: Convert raw inputs to prompts","file":"vllm/renderers/base.py","line":507,"expect":"# Step 1: Convert raw inputs to prompts"}},{"t":"Some model families ship their own renderer that replaces the Jinja template path, for example Mistral, DeepSeek V4 and Kimi K3 (renderers/mistral.py, deepseek_v4.py, kimi_k3.py)."},{"t":"Tokenization runs on a thread pool through make_async, so a long prompt never blocks the asyncio loop serving other requests.","ref":{"label":"make_async(tokenize)","file":"vllm/renderers/base.py","line":155,"expect":"self._tokenize_prompt_async = make_async("}}],"knobs":[{"k":"--chat-template","d":"Path or inline Jinja template that overrides the tokenizer's built-in one.","ref":{"label":"BaseFrontendArgs.chat_template","file":"vllm/entrypoints/launchers/cli_args.py","line":86,"expect":"chat_template: str | None = None"}},{"k":"--tokenizer-mode","d":"Which tokenizer implementation to load, such as auto or a model-specific mode."}]},{"phase":"in","unit":"v1/engine","title":"AsyncLLM.add_request","what":"AsyncLLM is the engine client inside the API process. InputProcessor validates the sampling params and packs everything into an EngineCoreRequest. OutputProcessor registers per-request state with its own output queue, and the background output_handler task starts on the first request.","refs":[{"label":"AsyncLLM.generate()","file":"vllm/v1/engine/async_llm.py","line":673,"expect":"async def generate"},{"label":"AsyncLLM.add_request()","file":"vllm/v1/engine/async_llm.py","line":374,"expect":"async def add_request"},{"label":"InputProcessor.process_inputs()","file":"vllm/v1/engine/input_processor.py","line":339,"expect":"def process_inputs"}],"from":"entrypoints/openai","hop":"dynamic","via":"engine_client.generate() via the EngineClient protocol in vllm/engine. Serving never imports AsyncLLM directly","per":"request","data":{"in":"engine input + SamplingParams","out":"EngineCoreRequest"},"detail":[{"t":"EngineCoreRequest carries request_id, prompt_token_ids, mm_features, sampling_params, arrival_time, lora_request and the data-parallel rank."},{"t":"InputProcessor checks the prompt fits max_model_len. When max_tokens is unset, it allows generation up to max_model_len minus the prompt length."},{"t":"The engine-internal id is the external id plus an 8-character random suffix, so two clients that reuse a request id never collide.","ref":{"label":"assign_request_id()","file":"vllm/v1/engine/input_processor.py","line":320,"expect":"def assign_request_id"}},{"t":"OutputProcessor creates a RequestState holding this request's detokenizer and output queue; generate() awaits that queue."}],"knobs":[]},{"phase":"in","unit":"v1/engine","title":"ZMQ hand-off to the engine core","ipc":true,"what":"The request is msgpack-encoded and sent over a ZMQ socket to a separate EngineCore process. A thread there decodes it into an input queue. Tokenization and HTTP stay in the API process, while scheduling and the GPU live in the engine core, so the two do not fight over the Python GIL.","refs":[{"label":"AsyncMPClient.add_request_async()","file":"vllm/v1/engine/core_client.py","line":1276,"expect":"async def add_request_async"},{"label":"EngineCoreProc.process_input_sockets()","file":"vllm/v1/engine/core.py","line":1757,"expect":"def process_input_sockets"},{"label":"EngineCore.add_request()","file":"vllm/v1/engine/core.py","line":486,"expect":"def add_request"}],"from":"v1/engine","hop":"ipc","via":"ZMQ socket: API process \u2192 EngineCore process","per":"request","data":{"in":"EngineCoreRequest","out":"msgpack frames over ZMQ"},"detail":[{"t":"MsgpackEncoder serializes the request. Tensors such as image embeddings go out as separate buffers next to the msgpack body.","ref":{"label":"MsgpackEncoder","file":"vllm/v1/serial_utils.py","line":135,"expect":"class MsgpackEncoder"}},{"t":"The engine core is a separate OS process named EngineCore (EngineCore_DP<n> under data parallelism)."},{"t":"Inside it, a background thread decodes each message onto an input queue. The busy loop drains the queue between steps and turns each EngineCoreRequest into a scheduler Request.","ref":{"label":"preprocess_add_request()","file":"vllm/v1/engine/core.py","line":1049,"expect":"def preprocess_add_request"}}],"knobs":[]},{"phase":"core","unit":"v1/core","title":"Scheduler: queue, schedule, allocate KV blocks","loop":true,"what":"The request joins the waiting queue. Async scheduling is on by default here, so the engine core runs step_with_batch_queue() with AsyncScheduler. Each step spends a token budget: running requests get their next decode token first, then waiting requests are admitted as prefill. The KV cache manager reuses cached prefix blocks and allocates new paged blocks, and the result is a SchedulerOutput saying which requests run and with how many tokens.","refs":[{"label":"EngineCore.step_with_batch_queue()","file":"vllm/v1/engine/core.py","line":670,"expect":"def step_with_batch_queue"},{"label":"Scheduler.add_request()","file":"vllm/v1/core/sched/scheduler.py","line":2568,"expect":"def add_request"},{"label":"Scheduler.schedule()","file":"vllm/v1/core/sched/scheduler.py","line":571,"expect":"def schedule"},{"label":"AsyncScheduler","file":"vllm/v1/core/sched/async_scheduler.py","line":14,"expect":"class AsyncScheduler"},{"label":"KVCacheManager.get_computed_blocks()","file":"vllm/v1/core/kv_cache_manager.py","line":264,"expect":"def get_computed_blocks"},{"label":"KVCacheManager.allocate_slots()","file":"vllm/v1/core/kv_cache_manager.py","line":371,"expect":"def allocate_slots"}],"from":"v1/engine","hop":"call","via":"EngineCore.add_request(), then step_with_batch_queue() \u2192 scheduler.schedule()","per":"step","data":{"in":"waiting + running Requests","out":"SchedulerOutput"},"detail":[{"t":"AsyncScheduler counts placeholder output tokens, so a request can be scheduled for its next decode before its previous token is known. The GPU fills in the real ids.","ref":{"label":"AsyncScheduler._update_after_schedule()","file":"vllm/v1/core/sched/async_scheduler.py","line":25,"expect":"def _update_after_schedule"}},{"t":"Prompts longer than the token budget are split across steps (chunked prefill), so one long prompt cannot stall everyone's decoding."},{"t":"Prefix caching is on by default. Full blocks are hashed with sha256 and matching cached blocks are reused, skipping that part of prefill.","ref":{"label":"prefix_caching_hash_algo","file":"vllm/config/cache.py","line":142,"expect":"prefix_caching_hash_algo: PrefixCachingHashAlgo = \"sha256\""}},{"t":"When KV blocks run out, the scheduler preempts a running request (the newest under FCFS, the lowest priority under priority scheduling), frees its blocks and recomputes it later.","ref":{"label":"preempt newest running request","file":"vllm/v1/core/sched/scheduler.py","line":780,"expect":"preempted_req = self.running[-1]"}},{"t":"A request's full data goes to the worker once. After that, only diffs are sent (scheduled_cached_reqs) to keep each step's message small."}],"knobs":[{"k":"--max-num-batched-tokens","d":"Token budget per step. API-server default: 8192 on H100/H200-class GPUs, 16384 on 160 GB+ GPUs, 2048 elsewhere.","ref":{"label":"server defaults by GPU","file":"vllm/engine/arg_utils.py","line":2891,"expect":"UsageContext.OPENAI_API_SERVER: 8192"}},{"k":"--max-num-seqs","d":"Most requests in one batch: 1024 on large GPUs, 256 otherwise."},{"k":"--enable-prefix-caching","d":"On by default; reuses KV blocks for shared prompt prefixes."},{"k":"--block-size","d":"Tokens per KV block; defaults to 16.","ref":{"label":"DEFAULT_BLOCK_SIZE","file":"vllm/config/cache.py","line":71,"expect":"DEFAULT_BLOCK_SIZE: ClassVar[int] = 16"}},{"k":"--scheduling-policy","d":"fcfs (default) or priority."}]},{"phase":"core","unit":"v1/executor","title":"Executor dispatches the step","what":"The engine core hands the SchedulerOutput to the executor without waiting and goes straight back to scheduling the next batch. With one GPU this is UniProcExecutor, which calls the worker in the same process. With tensor parallelism it would be MultiprocExecutor broadcasting to one worker per GPU.","refs":[{"label":"execute_model(..., non_block=True)","file":"vllm/v1/engine/core.py","line":699,"expect":"self.model_executor.execute_model("},{"label":"UniProcExecutor.execute_model()","file":"vllm/v1/executor/uniproc_executor.py","line":119,"expect":"def execute_model"},{"label":"Executor.get_class() picks the backend","file":"vllm/v1/executor/abstract.py","line":52,"expect":"def get_class"}],"from":"v1/engine","hop":"call","via":"step_with_batch_queue() \u2192 model_executor.execute_model(non_block=True)","per":"step","data":{"in":"SchedulerOutput","out":"future of ModelRunnerOutput"},"detail":[{"t":"The batch queue holds up to two batches (pipeline size + 1 with Model Runner V2), so CPU-side scheduling for step N+1 overlaps the GPU running step N.","ref":{"label":"max_concurrent_batches","file":"vllm/config/vllm.py","line":592,"expect":"def max_concurrent_batches"}},{"t":"Sampling is a separate call, sample_tokens(). That lets structured-output grammar masks be computed while the forward pass runs."},{"t":"Backend choice: uni for one GPU, mp for several GPUs on one node, ray for multi-node."}],"knobs":[{"k":"--tensor-parallel-size","d":"Shard each layer across N GPUs, which switches to MultiprocExecutor."},{"k":"--async-scheduling","d":"Unset means on when supported; set it false to schedule and execute strictly in turn."},{"k":"--distributed-executor-backend","d":"Force uni, mp, ray or external_launcher."}]},{"phase":"gpu","unit":"v1/worker","title":"GPU worker","what":"The Worker owns the device and the model runner. It forwards the step to the model runner and handles pipeline-parallel hand-offs when they apply. At this commit it builds Model Runner V2 by default on CUDA, falling back to the V1 runner for unsupported features.","refs":[{"label":"Worker.execute_model()","file":"vllm/v1/worker/gpu_worker.py","line":1257,"expect":"def execute_model"},{"label":"model_runner.execute_model(...)","file":"vllm/v1/worker/gpu_worker.py","line":1318,"expect":"self.model_runner.execute_model("},{"label":"VllmConfig.use_v2_model_runner","file":"vllm/config/vllm.py","line":716,"expect":"def use_v2_model_runner"}],"from":"v1/executor","hop":"call","via":"UniProcExecutor \u2192 driver worker, same process","per":"step","data":{"in":"SchedulerOutput","out":"ModelRunnerOutput"},"detail":[{"t":"At startup the worker profiles a dummy forward pass, then hands all memory left under gpu_memory_utilization to the KV cache. More cache means more concurrent requests.","ref":{"label":"determine_available_memory()","file":"vllm/v1/worker/gpu_worker.py","line":600,"expect":"def determine_available_memory"}},{"t":"Model Runner V2 is chosen unless VLLM_USE_V2_MODEL_RUNNER=0 or a feature V2 does not support yet forces the V1 runner."}],"knobs":[{"k":"--gpu-memory-utilization","d":"Share of GPU memory vLLM may use, weights included. Default 0.92 at this commit.","ref":{"label":"CacheConfig.gpu_memory_utilization","file":"vllm/config/cache.py","line":101,"expect":"gpu_memory_utilization: float = Field(default=0.92"}},{"k":"VLLM_USE_V2_MODEL_RUNNER","d":"Environment variable: 0 forces the older V1 runner, 1 forces V2."}]},{"phase":"gpu","unit":"v1/worker/gpu","title":"Model runner prepares the batch","what":"The runner updates its persistent batch: new requests are added, finished ones dropped. It builds input ids and positions for every scheduled token, plus block tables and slot mappings so attention knows where each token's KV lives. Then it runs the model, replaying a captured CUDA graph when the batch shape allows.","refs":[{"label":"GPUModelRunner.execute_model()","file":"vllm/v1/worker/gpu/model_runner.py","line":1699,"expect":"def execute_model"},{"label":"prepare_inputs(...)","file":"vllm/v1/worker/gpu/model_runner.py","line":1792,"expect":"self.prepare_inputs("},{"label":"CUDA graph replay","file":"vllm/v1/worker/gpu/model_runner.py","line":1991,"expect":"run_fullgraph"},{"label":"eager self.model(**model_inputs)","file":"vllm/v1/worker/gpu/model_runner.py","line":2030,"expect":"self.model(**model_inputs)"}],"from":"v1/worker","hop":"call","via":"Worker \u2192 GPUModelRunner.execute_model()","per":"step","data":{"in":"SchedulerOutput","out":"input ids, positions, block tables"},"detail":[{"t":"Requests live in a persistent batch on the GPU. Each step applies only additions, removals and new tokens instead of rebuilding the batch."},{"t":"Block tables map each request's logical KV blocks to physical ones; slot mappings say where each new token's keys and values get written."},{"t":"Default CUDA graph mode is FULL_AND_PIECEWISE. Batches matching a captured size replay one full graph; others replay piecewise graphs around attention.","ref":{"label":"cudagraph_mode default","file":"vllm/config/compilation.py","line":606,"expect":"cudagraph_mode: CUDAGraphMode = None"}},{"t":"The model was compiled with torch.compile at startup; LlamaModel carries the @support_torch_compile decorator.","ref":{"label":"@support_torch_compile","file":"vllm/model_executor/models/llama.py","line":337,"expect":"@support_torch_compile("}}],"knobs":[{"k":"--enforce-eager","d":"Skip CUDA graphs. Useful for debugging, slower for small decode batches."},{"k":"--compilation-config","d":"torch.compile and CUDA graph settings, including capture sizes and mode (-O for short)."}]},{"phase":"gpu","unit":"forward_context","title":"Forward context","what":"set_forward_context puts the attention metadata for this batch in one place for the length of the forward pass. Every attention layer reads it from there, so model code never has to pass batching details through its forward() signatures.","refs":[{"label":"set_forward_context()","file":"vllm/forward_context.py","line":278,"expect":"def set_forward_context"},{"label":"entered by the runner","file":"vllm/v1/worker/gpu/model_runner.py","line":2000,"expect":"with set_forward_context("}],"from":"v1/worker/gpu","hop":"call","via":"Runner enters set_forward_context()","per":"step","data":{"in":"attention metadata","out":"context visible to every layer"},"detail":[{"t":"ForwardContext holds attn_metadata and slot_mapping keyed by layer name, the CUDA graph runtime mode, a batch descriptor and data-parallel metadata.","ref":{"label":"class ForwardContext","file":"vllm/forward_context.py","line":141,"expect":"class ForwardContext"}},{"t":"It is a context manager, cleared as soon as the forward pass finishes, so stale metadata cannot leak into the next step."}],"knobs":[]},{"phase":"gpu","unit":"model_executor/models","title":"Model forward (Llama shown)","what":"The model class for the checkpoint's architecture runs its decoder stack: embeddings, then for each layer RMSNorm, attention and MLP. Every scheduled token, prefill and decode alike, goes through as one flattened batch.","refs":[{"label":"LlamaForCausalLM.forward()","file":"vllm/model_executor/models/llama.py","line":534,"expect":"def forward"},{"label":"LlamaDecoderLayer.forward()","file":"vllm/model_executor/models/llama.py","line":313,"expect":"def forward"},{"label":"LlamaAttention: self.attn(q, k, v)","file":"vllm/model_executor/models/llama.py","line":232,"expect":"self.attn(q, k, v)"}],"from":"v1/worker/gpu","hop":"dynamic","via":"self.model(**model_inputs): the class is picked from the model registry at load time","per":"step","data":{"in":"input ids + positions","out":"hidden states"},"detail":[{"t":"The registry maps the architecture name in config.json to a module and class, e.g. \"LlamaForCausalLM\" \u2192 (\"llama\", \"LlamaForCausalLM\"). The import happens by name at load time, which is why this hop has no import edge.","ref":{"label":"registry entry","file":"vllm/model_executor/models/registry.py","line":147,"expect":"\"LlamaForCausalLM\": (\"llama\", \"LlamaForCausalLM\")"}},{"t":"Projections use tensor-parallel layers (QKVParallelLinear, RowParallelLinear), so the same model code shards across GPUs."},{"t":"There is no padding: tokens from all requests are packed into one flat batch with per-token positions."}],"knobs":[]},{"phase":"gpu","unit":"model_executor/layers/attention","title":"Attention layer","what":"The model-agnostic Attention module. It dispatches through a registered custom op (unified_attention_with_output) that looks up this layer's metadata in the forward context and calls the selected backend. Using a custom op keeps attention opaque to torch.compile and CUDA graphs.","refs":[{"label":"Attention.forward()","file":"vllm/model_executor/layers/attention/attention.py","line":488,"expect":"def forward"},{"label":"unified_attention_with_output()","file":"vllm/model_executor/layers/attention/attention.py","line":767,"expect":"def unified_attention_with_output"}],"from":"model_executor/models","hop":"call","via":"LlamaAttention calls self.attn(q, k, v)","per":"step","data":{"in":"q, k, v","out":"attention output"},"detail":[{"t":"unified_attention_with_output is registered as a custom op and listed as a graph-splitting op. torch.compile treats it as opaque, which is where piecewise CUDA graphs are cut.","ref":{"label":"listed in _attention_ops","file":"vllm/config/compilation.py","line":765,"expect":"\"vllm::unified_attention_with_output\","}},{"t":"KV cache precision is configurable; fp8 roughly halves cache memory compared with bf16."}],"knobs":[{"k":"--kv-cache-dtype","d":"auto (model dtype) by default; fp8, fp8_e4m3, fp8_e5m2 and others trade precision for capacity."}]},{"phase":"gpu","unit":"v1/attention/backends","title":"FlashAttention kernel","what":"reshape_and_cache_flash writes this step's keys and values into the paged KV cache, then flash_attn_varlen_func computes attention over each sequence's cached blocks. FlashAttention is the first choice on Hopper and Ampere GPUs; Blackwell prefers FlashInfer.","refs":[{"label":"FlashAttentionImpl.forward()","file":"vllm/v1/attention/backends/flash_attn.py","line":1231,"expect":"def forward"},{"label":"reshape_and_cache_flash(...)","file":"vllm/v1/attention/backends/flash_attn.py","line":1536,"expect":"reshape_and_cache_flash("},{"label":"CUDA backend priority","file":"vllm/platforms/cuda.py","line":83,"expect":"def _get_backend_priorities"}],"from":"model_executor/layers/attention","hop":"dynamic","via":"self.impl.forward(): backend picked by the attention selector at startup","per":"step","data":{"in":"q, k, v + paged KV cache","out":"attention output"},"detail":[{"t":"The FlashAttention version follows the GPU: FA3 on Hopper (SM90), FA4 on SM100 Blackwell when supported, FA2 otherwise.","ref":{"label":"FA version choice","file":"vllm/v1/attention/backends/fa_utils.py","line":99,"expect":"if device_capability.major == 9 and is_fa_version_supported(3):"}},{"t":"Prefill and decode tokens go through the same variable-length kernel call, each sequence attending over its own cached blocks."}],"knobs":[{"k":"--attention-backend","d":"Override the automatic choice, e.g. FLASH_ATTN, FLASHINFER, TRITON_ATTN."}]},{"phase":"gpu","unit":"model_executor/layers","title":"Logits","what":"Logits are computed only for positions that need a next token. The runner indexes the hidden states with logits_indices before calling compute_logits, so a 2,000-token prompt produces one row of logits, not 2,000. The model's LogitsProcessor applies the LM head.","refs":[{"label":"GPUModelRunner.sample()","file":"vllm/v1/worker/gpu/model_runner.py","line":1572,"expect":"def sample("},{"label":"hidden_states[input_batch.logits_indices]","file":"vllm/v1/worker/gpu/model_runner.py","line":1594,"expect":"hidden_states[input_batch.logits_indices]"},{"label":"LlamaForCausalLM.compute_logits()","file":"vllm/model_executor/models/llama.py","line":546,"expect":"def compute_logits"},{"label":"LogitsProcessor.forward()","file":"vllm/model_executor/layers/logits_processor.py","line":98,"expect":"def forward"}],"from":"v1/worker/gpu","hop":"call","via":"Worker.sample_tokens() \u2192 GPUModelRunner.sample() \u2192 model.compute_logits() on the sample positions only","per":"step","data":{"in":"hidden states at sample positions","out":"logits [requests \u00d7 vocab]"},"detail":[{"t":"With tensor parallelism the vocabulary is sharded across GPUs and gathered here."},{"t":"Models that use logit soft-capping apply it in LogitsProcessor.","ref":{"label":"soft_cap","file":"vllm/model_executor/layers/logits_processor.py","line":113,"expect":"if self.soft_cap is not None:"}}],"knobs":[]},{"phase":"gpu","unit":"v1/worker/gpu","title":"Sampling","what":"sample_tokens runs the GPU sampler over the logits: penalties and logit bias, temperature, top-k, top-p and min-p, then sampling with per-request seeds. Grammar masks for structured output apply here. The sampled ids go back to the engine core in a ModelRunnerOutput.","refs":[{"label":"GPUModelRunner.sample_tokens()","file":"vllm/v1/worker/gpu/model_runner.py","line":2073,"expect":"def sample_tokens"},{"label":"Sampler.__call__()","file":"vllm/v1/worker/gpu/sample/sampler.py","line":134,"expect":"def __call__"},{"label":"Sampler.apply_sampling_params()","file":"vllm/v1/worker/gpu/sample/sampler.py","line":226,"expect":"def apply_sampling_params"},{"label":"gumbel_sample()","file":"vllm/v1/worker/gpu/sample/gumbel.py","line":336,"expect":"def gumbel_sample"}],"from":"model_executor/layers","hop":"return","via":"Logits return to GPUModelRunner.sample(), which hands them to the Sampler","per":"step","data":{"in":"logits","out":"sampled token ids (+ logprobs)"},"detail":[{"t":"Order: copy logits to FP32, logits processors (penalties, logit bias, bad words, custom), thinking-budget forcing, temperature, min-p, then top-k and top-p.","ref":{"label":"apply_sampling_params()","file":"vllm/v1/worker/gpu/sample/sampler.py","line":226,"expect":"def apply_sampling_params"}},{"t":"It uses FlashInfer's fused top-k/top-p sampler when it can, otherwise Gumbel-max sampling, which supports per-request seeds."},{"t":"Results are copied to the CPU on a separate CUDA stream (AsyncOutput), so the GPU can start the next step meanwhile.","ref":{"label":"class AsyncOutput","file":"vllm/v1/worker/gpu/async_utils.py","line":115,"expect":"class AsyncOutput"}}],"knobs":[]},{"phase":"core","unit":"v1/core","title":"Update state, check stop","what":"update_from_output appends the new token to each request and checks stop conditions: EOS, max_tokens, stop token ids, max model length. Finished requests release their KV blocks. Everything becomes EngineCoreOutputs. Unless the request has stopped, the next step() schedules it again.","refs":[{"label":"scheduler.update_from_output(...)","file":"vllm/v1/engine/core.py","line":755,"expect":"self.scheduler.update_from_output("},{"label":"Scheduler.update_from_output()","file":"vllm/v1/core/sched/scheduler.py","line":1978,"expect":"def update_from_output"},{"label":"check_stop()","file":"vllm/v1/core/sched/utils.py","line":98,"expect":"def check_stop"}],"from":"v1/engine","hop":"call","via":"step_with_batch_queue() \u2192 scheduler.update_from_output()","per":"step","data":{"in":"ModelRunnerOutput","out":"EngineCoreOutputs per client"},"detail":[{"t":"Stop checks run in order: EOS token, stop_token_ids, then length (max_tokens or max_model_len). min_tokens holds back later stops, and optional repetition detection can end the request too."},{"t":"Stop strings are not checked here; they need text. The detokenizer in the API process matches them and aborts the request in the engine (step 17)."},{"t":"Finished requests release their KV blocks. With prefix caching the blocks stay reusable until they are evicted."}],"knobs":[]},{"phase":"out","unit":"v1/engine","title":"ZMQ hand-back to the API process","ipc":true,"what":"An output thread in the engine core serializes EngineCoreOutputs and pushes them over ZMQ. In the API process, a socket task decodes them into a queue that AsyncLLM's output_handler drains.","refs":[{"label":"EngineCoreProc.process_output_sockets()","file":"vllm/v1/engine/core.py","line":1859,"expect":"def process_output_sockets"},{"label":"process_outputs_socket()","file":"vllm/v1/engine/core_client.py","line":1151,"expect":"async def process_outputs_socket"},{"label":"AsyncMPClient.get_output_async()","file":"vllm/v1/engine/core_client.py","line":1207,"expect":"async def get_output_async"}],"from":"v1/engine","hop":"ipc","via":"ZMQ socket: EngineCore process \u2192 API process","per":"step","data":{"in":"EngineCoreOutputs","out":"msgpack frames over ZMQ"},"detail":[{"t":"Each EngineCoreOutput carries the request id, new_token_ids, new_logprobs, finish_reason and stop_reason; scheduler stats ride along for metrics."},{"t":"Serialization runs on its own output thread, overlapping the engine's next step.","ref":{"label":"process_output_sockets()","file":"vllm/v1/engine/core.py","line":1859,"expect":"def process_output_sockets"}}],"knobs":[]},{"phase":"out","unit":"v1/engine","title":"Detokenize and route to the request","what":"OutputProcessor.process_outputs runs incremental detokenization, so only the newly decoded text is produced, and applies stop strings. It wraps the result in a RequestOutput and puts it on that request's collector. The generate() loop picks it up.","refs":[{"label":"AsyncLLM output_handler()","file":"vllm/v1/engine/async_llm.py","line":820,"expect":"async def output_handler"},{"label":"OutputProcessor.process_outputs()","file":"vllm/v1/engine/output_processor.py","line":657,"expect":"def process_outputs"},{"label":"IncrementalDetokenizer.update()","file":"vllm/v1/engine/detokenizer.py","line":95,"expect":"def update"},{"label":"generate() awaits the queue","file":"vllm/v1/engine/async_llm.py","line":742,"expect":"await q.get()"}],"from":"v1/engine","hop":"call","via":"output_handler task \u2192 OutputProcessor.process_outputs()","per":"step","data":{"in":"new token ids","out":"RequestOutput with delta text"},"detail":[{"t":"Fast tokenizers decode incrementally with the tokenizers library's DecodeStream, so each step costs only the new tokens."},{"t":"Stop strings are matched on the new text. On a match, the request finishes with that stop_reason and an abort goes to the engine core.","ref":{"label":"if stop_string:","file":"vllm/v1/engine/output_processor.py","line":747,"expect":"if stop_string:"}},{"t":"stream_interval buffers that many tokens before emitting. The default of 1 sends every token right away."}],"knobs":[{"k":"--stream-interval","d":"Tokens to batch per streamed update (default 1). Higher values reduce host overhead.","ref":{"label":"SchedulerConfig.stream_interval","file":"vllm/config/scheduler.py","line":214,"expect":"stream_interval: int = Field(default=1"}}]},{"phase":"out","unit":"entrypoints/openai","title":"Server-sent events to the client","what":"The stream generator turns each RequestOutput into an OpenAI chat.completion.chunk carrying the new delta text, plus reasoning and tool-call deltas when a parser is active. It yields each one as an SSE line, which StreamingResponse flushes to the socket. The final chunk carries finish_reason and usage.","refs":[{"label":"chat_completion_stream_generator()","file":"vllm/entrypoints/openai/chat_completion/serving.py","line":461,"expect":"async def chat_completion_stream_generator"},{"label":"yield f\"data: ...\"","file":"vllm/entrypoints/openai/chat_completion/serving.py","line":584,"expect":"yield f\"data: {data}"}],"from":"v1/engine","hop":"return","via":"generate() yields each RequestOutput back to the serving loop","per":"step","data":{"in":"RequestOutput","out":"SSE: data: {chat.completion.chunk}"},"detail":[{"t":"The first chunk carries the assistant role with empty content; later chunks carry content deltas."},{"t":"Reasoning and tool-call deltas appear when --reasoning-parser or --tool-call-parser (with --enable-auto-tool-choice) are set."},{"t":"Usage arrives in a final chunk when stream_options.include_usage is set, or always with --enable-force-include-usage. The stream ends with data: [DONE].","ref":{"label":"data: [DONE]","file":"vllm/entrypoints/openai/chat_completion/serving.py","line":512,"expect":"yield \"data: [DONE]"}}],"knobs":[{"k":"--reasoning-parser","d":"Splits model reasoning into a separate reasoning delta field."},{"k":"--tool-call-parser","d":"Parses tool calls out of the text; needs --enable-auto-tool-choice.","ref":{"label":"BaseFrontendArgs.tool_call_parser","file":"vllm/entrypoints/launchers/cli_args.py","line":122,"expect":"tool_call_parser: str | None = None"}}]}]}</script>
<script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
const GH = 'https://github.com/vllm-project/vllm';
const SHA = D.meta.sha;
const COLW = 300, ROWH = 88, W = 212, H = 68;
const DOMAINS = {
  'core':      { name: 'Core & config',   c: '#8b98a9' },
  'engine-v1': { name: 'V1 engine',       c: '#6f9cff' },
  'models':    { name: 'Models & layers', c: '#b98cf0' },
  'kernels':   { name: 'Kernels & ops',   c: '#e6b450' },
  'runtime':   { name: 'Runtime',         c: '#4fd1a5' },
  'api':       { name: 'API & serving',   c: '#5cc8e0' },
  'io':        { name: 'Inputs & tokens', c: '#a3be5c' },
  'obs':       { name: 'Observability',   c: '#d6dbe3' },
};
const STATUS = { hot: 'Hot', active: 'Active', stable: 'Stable', dormant: 'Dormant' };
const STATUS_DESC = { hot: 'top 15% by commits in the last 30 days, scaled for size', active: 'steady recent commits', stable: 'few recent commits', dormant: 'no commits since July' };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtK = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n);
const nodes = D.nodes, edges = D.edges;
const byId = new Map(nodes.map(n => [n.id, n]));

// ---------- geometry ----------
const colCount = {};
nodes.forEach(n => colCount[n.col] = (colCount[n.col] || 0) + 1);
const maxRows = Math.max(...Object.values(colCount));
nodes.forEach(n => {
  n.x = n.col * COLW;
  n.y = (n.row - (colCount[n.col] - 1) / 2) * ROWH;
  n.in = []; n.out = []; n.c = DOMAINS[n.domain].c;
  if (nodes.some(m => m.id.startsWith(n.id + '/'))) n.label = n.id + '/*.py';
});
edges.forEach((e, i) => {
  e.i = i;
  e.to = byId.get(e.s);    // importer: cable enters on its left
  e.from = byId.get(e.t);  // dependency: cable leaves from its right
  e.from.out.push(e); e.to.in.push(e);
});
const maxC30 = Math.max(...nodes.map(n => n.c30));
const edgeMap = new Map(edges.map(e => [e.s + '|' + e.t, e]));

function computePorts(n) {
  n.out.sort((a, b) => a.to.y - b.to.y).forEach((e, k) => e.oi = k);
  n.in.sort((a, b) => a.from.y - b.from.y).forEach((e, k) => e.ii = k);
}
nodes.forEach(computePorts);
const portY = (cnt, k) => cnt <= 1 ? H / 2 : 10 + (H - 20) * k / (cnt - 1);

// ---------- build DOM ----------
const world = $('#world'), stage = $('#stage');
const cablesG = $('#cables'), hitsG = $('#hits'), halo = $('#halo');
const SVGNS = 'http://www.w3.org/2000/svg';
const paths = [], hits = [];
edges.forEach(e => {
  const p = document.createElementNS(SVGNS, 'path');
  e.kc = e.eager ? '' : e.lazy ? 'k-lazy' : 'k-type';
  p.setAttribute('stroke', e.from.c);
  e.sw = Math.min(3.6, 1 + Math.log2(e.w) * 0.42);
  p.style.setProperty('--w', e.sw);
  p.setAttribute('stroke-opacity', 0.13);
  if (e.kc) p.classList.add(e.kc);
  if (e.back) p.classList.add('back');
  cablesG.appendChild(p); paths.push(p);
  const h = document.createElementNS(SVGNS, 'path');
  h.dataset.e = e.i; hitsG.appendChild(h); hits.push(h);
});
const nodesEl = $('#nodes');
const frag = document.createDocumentFragment();
nodes.forEach(n => {
  const el = document.createElement('div');
  el.className = 'node st-' + n.status;
  el.dataset.id = n.id;
  const segs = n.label.split('/');
  const last = segs.pop();
  el.innerHTML =
    `<span class="port i"></span><span class="port o"></span>` +
    `<div class="nh"><span class="sg ${n.status}" title="${STATUS[n.status]}"></span>` +
    `<span class="nl">${segs.length ? esc(segs.join('/') + '/') : ''}<b>${esc(last)}</b></span>` +
    `<span class="dm" style="--c:${n.c}" title="${esc(DOMAINS[n.domain].name)}"></span></div>` +
    `<div class="nm"><span><b>${n.files}</b> ${n.files === 1 ? 'file' : 'files'}</span><span><b>${fmtK(n.loc)}</b> loc</span><span><b>${n.c30}</b> Δ30d</span></div>` +
    `<div class="nb"><i style="width:${Math.max(3, n.c30 / maxC30 * 100).toFixed(1)}%"></i></div>`;
  el.style.transform = `translate(${n.x}px,${n.y}px)`;
  n.el = el; frag.appendChild(el);
});
// column depth labels
const topY = -(maxRows - 1) / 2 * ROWH - 34;
Object.keys(colCount).forEach(c => {
  const l = document.createElement('div');
  l.className = 'col-l';
  l.style.transform = `translate(${c * COLW}px,${topY}px)`;
  l.innerHTML = `Layer <b>${String(c).padStart(2, '0')}</b> · ${colCount[c]}`;
  frag.appendChild(l);
});
nodesEl.appendChild(frag);

// ---------- cable physics ----------
// Each cable carries a "sag" (gravity droop of its control points). Relaxed cables hang;
// highlighted cables pull taut through a damped spring, so they snap with a little overshoot.
const sag = new Float32Array(edges.length), vel = new Float32Array(edges.length);
const taut = new Uint8Array(edges.length);
const active = new Set();
let reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function ends(e) {
  const a = e.from, b = e.to;
  return [a.x + W, a.y + portY(a.out.length, e.oi), b.x, b.y + portY(b.in.length, e.ii)];
}
function baseSag(e) {
  const [x0, y0, x1, y1] = ends(e);
  return Math.max(6, Math.min(52, Math.hypot(x1 - x0, y1 - y0) * 0.05));
}
function geom(e, s) {
  const [x0, y0, x1, y1] = ends(e);
  const dx = x1 - x0;
  const c = dx >= 0 ? Math.max(50, dx * 0.48) : Math.min(240, 90 + -dx * 0.18);
  return { x0, y0, x1, y1, c, s };
}
function pathD(e, s) {
  const { x0, y0, x1, y1, c } = geom(e, s);
  return `M${x0.toFixed(1)},${y0.toFixed(1)}C${(x0 + c).toFixed(1)},${(y0 + s).toFixed(1)} ${(x1 - c).toFixed(1)},${(y1 + s).toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
}
let hoverEdge = null;
function draw(i) {
  const e = edges[i];
  const d = pathD(e, sag[i]);
  paths[i].setAttribute('d', d);
  hits[i].setAttribute('d', d);
  if (hoverEdge === e) halo.setAttribute('d', d);
  const o = ov.get(i);
  if (o) placeOverlay(e, o, d, sag[i]);
}
// Overlay for highlighted cables. Arrowheads point at the module being imported (the used part).
const ov = new Map();
const casingG = $('#casingG'), topG = $('#topG'), arrowG = $('#arrowG'), badgeG = $('#badgeG');
function svgEl(tag, attrs) { const el = document.createElementNS(SVGNS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; }
function addOverlay(i) {
  if (ov.has(i)) return;
  const e = edges[i];
  const cls = [e.kc, e.back ? 'back' : ''].filter(Boolean).join(' ');
  const cas = svgEl('path', {}); cas.style.setProperty('--w', e.sw);
  const top = svgEl('path', { stroke: e.from.c, class: cls }); top.style.setProperty('--w', e.sw);
  const arr = svgEl('path', { d: 'M0,0L-8,-4.4L-5.6,0L-8,4.4Z', fill: e.from.c, class: e.back ? 'back' : '' });
  casingG.appendChild(cas); topG.appendChild(top); arrowG.appendChild(arr);
  const o = { cas, top, arr, badge: null };
  ov.set(i, o);
  if (hoverEdge === e) top.classList.add('hot');
  placeOverlay(e, o, paths[i].getAttribute('d'), sag[i]);
}
function removeOverlay(i) {
  const o = ov.get(i); if (!o) return;
  o.cas.remove(); o.top.remove(); o.arr.remove(); if (o.badge) o.badge.remove();
  ov.delete(i);
}
function setBadge(i, on) {
  const o = ov.get(i); if (!o || !!o.badge === on) return;
  if (on) {
    const e = edges[i];
    const g = svgEl('g', {});
    const w = String(e.w).length > 2 ? 10.5 : 8.5;
    g.appendChild(svgEl('circle', { r: w, stroke: e.back ? '#ff5d7a' : e.from.c }));
    const t = svgEl('text', {}); t.textContent = e.w; g.appendChild(t);
    badgeG.appendChild(g); o.badge = g;
    placeOverlay(e, o, paths[i].getAttribute('d'), sag[i]);
  } else { o.badge.remove(); o.badge = null; }
}
function placeOverlay(e, o, d, s) {
  o.cas.setAttribute('d', d); o.top.setAttribute('d', d);
  const g = geom(e, s);
  // tangent at the start of the cubic is (c, s); the arrow points back along it, into the imported module
  const ang = Math.atan2(-s, -g.c) * 180 / Math.PI;
  const sc = (0.8 + e.sw * 0.22) * (lastZs || 1);
  o.arr.setAttribute('transform', `translate(${g.x0.toFixed(1)},${g.y0.toFixed(1)}) rotate(${ang.toFixed(1)}) scale(${sc.toFixed(2)})`);
  if (o.badge) {
    const bx = (g.x0 + g.x1) / 2, by = (g.y0 + g.y1) / 2 + 0.75 * s;
    o.badge.setAttribute('transform', `translate(${bx.toFixed(1)},${by.toFixed(1)}) scale(${lastZs || 1})`);
  }
}
function setHot(e, on) { paths[e.i].classList.toggle('hot', on); const o = ov.get(e.i); if (o) o.top.classList.toggle('hot', on); }
edges.forEach((e, i) => { sag[i] = baseSag(e); draw(i); });

function kick(i, impulse) {
  if (reduceMotion) { sag[i] = taut[i] ? 0 : baseSag(edges[i]); draw(i); return; }
  vel[i] += impulse; active.add(i); startLoop();
}
let looping = false, lastT = 0;
function startLoop() { if (!looping) { looping = true; lastT = performance.now(); requestAnimationFrame(step); } }
function step(t) {
  let dt = Math.min(0.034, (t - lastT) / 1000); lastT = t;
  const K = 170, C = 11;
  for (const i of active) {
    const target = taut[i] ? 0 : baseSag(edges[i]);
    // two substeps for stability
    for (let s = 0; s < 2; s++) {
      const h = dt / 2;
      const a = K * (target - sag[i]) - C * vel[i];
      vel[i] += a * h; sag[i] += vel[i] * h;
    }
    draw(i);
    if (Math.abs(target - sag[i]) < 0.05 && Math.abs(vel[i]) < 0.05) { sag[i] = target; draw(i); active.delete(i); }
  }
  if (active.size) requestAnimationFrame(step); else looping = false;
}
function setTaut(i, on) {
  if (taut[i] === (on ? 1 : 0)) return;
  taut[i] = on ? 1 : 0;
  kick(i, on ? -30 : 40);
}

// ---------- view (pan / zoom) ----------
const view = { x: 0, y: 0, k: 1 };
let miniDirty = true, lastZs = 0;
function applyView() {
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  const g = 22 * view.k;
  stage.style.backgroundSize = `${g}px ${g}px`;
  stage.style.backgroundPosition = `${view.x}px ${view.y}px`;
  world.classList.toggle('far', view.k < 0.46);
  if (typeof tracing !== 'undefined' && tracing) positionCard();
  // stroke compensation: cables keep a near-constant on-screen thickness across zoom levels
  const zs = Math.min(3, Math.max(0.5, Math.round(1 / view.k * 8) / 8));
  if (zs !== lastZs) { lastZs = zs; world.style.setProperty('--zs', zs); ov.forEach((o, i) => draw(i)); if (tracing) placeTraceDecor(); }
  miniDirty = true; scheduleMini();
}
function bounds(list) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  list.forEach(n => { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x + W); y1 = Math.max(y1, n.y + H); });
  return { x0, y0, x1, y1 };
}
function fitTo(list, pad = 50, maxK = 1.1) {
  const b = bounds(list);
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const k = Math.min(maxK, (sw - pad * 2) / (b.x1 - b.x0), (sh - pad * 2) / (b.y1 - b.y0 + 40));
  return { k, x: sw / 2 - (b.x0 + b.x1) / 2 * k, y: sh / 2 - ((b.y0 + b.y1) / 2 - 14) * k };
}
let anim = null;
function animateTo(t, ms = 460) {
  if (reduceMotion) { Object.assign(view, t); applyView(); return; }
  const s = { ...view }, t0 = performance.now();
  cancelAnimationFrame(anim);
  const ease = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
  const tick = now => {
    const u = Math.min(1, (now - t0) / ms), e = ease(u);
    // zoom out a touch mid-flight for long jumps, like a camera dolly
    view.k = s.k + (t.k - s.k) * e; view.x = s.x + (t.x - s.x) * e; view.y = s.y + (t.y - s.y) * e;
    applyView();
    if (u < 1) anim = requestAnimationFrame(tick);
  };
  anim = requestAnimationFrame(tick);
}
function zoomAt(f, cx, cy) {
  const k = Math.max(0.08, Math.min(2.6, view.k * f));
  view.x = cx - (cx - view.x) * k / view.k; view.y = cy - (cy - view.y) * k / view.k; view.k = k;
  applyView();
}
function centerOn(n, k = Math.max(view.k, 0.85)) {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  animateTo({ k, x: sw / 2 - (n.x + W / 2) * k, y: sh / 2 - (n.y + H / 2) * k });
}
stage.addEventListener('wheel', ev => {
  if (ev.target.closest('.callout')) return;
  ev.preventDefault();
  const r = stage.getBoundingClientRect();
  const f = Math.exp(-ev.deltaY * (ev.ctrlKey ? 0.01 : 0.0016));
  cancelAnimationFrame(anim);
  zoomAt(f, ev.clientX - r.left, ev.clientY - r.top);
}, { passive: false });
$('#zin').onclick = () => zoomAt(1.25, stage.clientWidth / 2, stage.clientHeight / 2);
$('#zout').onclick = () => zoomAt(0.8, stage.clientWidth / 2, stage.clientHeight / 2);
$('#zfit').onclick = () => animateTo(fitTo(nodes.filter(n => !n.off)));
$('#z1').onclick = () => { const sw = stage.clientWidth, sh = stage.clientHeight; const cx = (sw / 2 - view.x) / view.k, cy = (sh / 2 - view.y) / view.k; animateTo({ k: 1, x: sw / 2 - cx, y: sh / 2 - cy }); };

// ---------- pointer: pan, drag nodes, pinch ----------
const pointers = new Map();
let gesture = null;
stage.addEventListener('pointerdown', ev => {
  if (ev.target.closest('.zoom,.mini,.callout,.offpin')) return;
  stage.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  cancelAnimationFrame(anim);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    gesture = { type: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, vx: view.x, vy: view.y };
    return;
  }
  const nodeEl = ev.target.closest('.node');

  let pl = sw / 2 + Math.cos(ang) * t - pw / 2, pt = sh / 2 + Math.sin(ang) * t - ph / 2;

// ring the next step's module so the eye knows where the trace goes
function markNext() {

}
// ---------- autoplay ----------
let playing = false, playTimer = 0;
function setPlaying(on) {
  playing = on; clearTimeout(playTimer);
  if (on) { if (tstep >= T.steps.length) setStep(1, true, true); else schedulePlay(); }
  renderCard();
}
function schedulePlay() {
  clearTimeout(playTimer);
  if (!playing) return;
  playTimer = setTimeout(() => {
    if (!playing || !tracing) return;
    if (tstep >= T.steps.length) { setPlaying(false); return; }
    setStep(tstep + 1, true, true);
  }, 6500);
}
callout.addEventListener('click', ev => {
  const b = ev.target.closest('[data-cact]'); if (!b) return;
  const a = b.dataset.cact;
  if (a === 'next') setStep(Math.min(T.steps.length, tstep + 1));
  else if (a === 'prev') setStep(Math.max(1, tstep - 1));
  else if (a === 'play') setPlaying(!playing);
  else if (a === 'restart' || a === 'close') setStep(0);
});
callout.addEventListener('wheel', ev => ev.stopPropagation(), { passive: true });
$('#offpin').addEventListener('click', () => setStep(Math.min(T.steps.length, tstep + 1)));
let packetRaf = 0;
function runPacket() {
  cancelAnimationFrame(packetRaf);
  const el = tEls.get(tstep);
  if (!el) { packet.style.display = 'none'; return; }
  const s = T.steps[tstep - 1];
  packet.style.setProperty('--pc', s.c); packet.style.display = '';
  const t0 = performance.now(), dur = s.hop === 'ipc' ? 1100 : 1500;
  const tick = now => {
    if (!tracing || tEls.get(tstep) !== el) return;
    const u = reduceMotion ? 1 : ((now - t0) % (dur + 500)) / dur;
    const p = el.line.getPointAtLength(Math.min(1, u) * el.L);
    packet.setAttribute('cx', p.x); packet.setAttribute('cy', p.y); packet.setAttribute('r', 5.5 * (lastZs || 1));
    packet.style.opacity = u > 1 ? 0 : 1;
    if (!reduceMotion) packetRaf = requestAnimationFrame(tick);
  };
  packetRaf = requestAnimationFrame(tick);
}
function traceHover(ev) {
  const nodeEl = ev.target.closest && ev.target.closest('.node');
  const tHit = !nodeEl && ev.target.closest && ev.target.closest('.thit');
  let html = '';
  if (nodeEl) {
    const n = byId.get(nodeEl.dataset.id), ns = traceSteps.get(n);
    if (ns) html = `<b>${esc(n.label)}</b>` + ns.map(k => { const s = T.steps[k - 1]; return `<br><span style="color:${s.c}">${k}</span> ${esc(s.title)}`; }).join('') + `<br><span class="k">click to jump to step ${ns.find(k => k > tstep) || ns[0]}</span>`;
    else html = `<b>${esc(n.label)}</b><br><span class="k">not on this request's path · click to leave the trace and inspect it</span>`;
  } else if (tHit) {
    const s = T.steps[+tHit.dataset.step - 1];
    html = `<span style="color:${s.c}">Step ${s.n}</span> <b>${esc(s.title)}</b><br><span class="k">${HOP[s.hop]} · ${esc(s.via)}</span>`;
  }
  if (!html) { hideTip(); return; }
  tip.innerHTML = html; tip.hidden = false;
  tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, ev.clientX + 14) + 'px'; tip.style.top = (ev.clientY + 16) + 'px';
}
const refLink = r => `${GH}/blob/${SHA}/${r.file}#L${r.line}`;
function renderTrace() {
  if (!tracing) return;
  const total = T.steps.length;
  let html = `<div class="insp-h"><span class="crumb">Request trace</span><button class="ib" data-act="exit-trace" title="Leave the trace (Esc)">Exit trace</button></div>` +
    `<div class="tctl"><button class="ib" data-act="tprev" ${tstep === 0 ? 'disabled' : ''} title="Previous step (←)">← Prev</button>` +
    `<span class="pos">${tstep ? `Step <b>${tstep}</b> of ${total}` : `<b>${total}</b> steps`}</span>` +
    `<button class="ib" data-act="tnext" ${tstep === total ? 'disabled' : ''} title="Next step (→)">${tstep ? 'Next →' : 'Start →'}</button></div>` +
    `<section class="sec"><h2 class="title" style="font-size:14px">${esc(T.title)}</h2><p class="prose">${esc(T.scenario)}</p>` +
    `<p class="note" style="margin-top:8px"><span class="hop">CALL</span>direct import · <span class="hop dynamic">DYNAMIC</span>protocol, registry or selector · <span class="hop ipc">IPC</span>between processes · <span class="hop return">YIELD</span>result flows back</p></section>`;
  // phases recur (the engine core is visited going in and coming back), so group contiguous runs
  let runPhase = null;

    if (s.phase !== runPhase) {
      if (runPhase) html += `</div>`;
      runPhase = s.phase;
      html += `<div class="tphase" style="--c:${s.c}"><h3><i></i>${esc(PHASES[s.phase].name)}<span>${esc(PHASES[s.phase].desc)}</span></h3>`;
    }
    const cls = s.n === tstep ? 'cur' : (tstep && s.n < tstep ? 'past' : '');
    html += `<button class="ts ${cls}" data-step="${s.n}" style="--c:${s.c}" aria-current="${s.n === tstep}"><span class="num">${s.n}</span><span class="tt">${esc(s.title)}</span><span class="md">${esc(s.node.label)}</span></button>`;
    if (s.n === tstep) {
      html += `<div class="tbody" style="--c:${s.c}"><div class="via"><span class="hop ${s.hop}">${HOP[s.hop]}</span>${esc(s.via)}</div>` +
        `<p class="prose">${esc(s.what)}</p>` + detailBlocks(s, false) +
        `<div class="csec"><h5>Code</h5></div><div class="refs">${s.refs.map(r => `<a href="${refLink(r)}" target="_blank" rel="noopener"><b>${esc(r.label)}</b><span>${esc(r.file.replace(/^vllm\//, ''))}:${r.line}</span></a>`).join('')}</div>` +
        `<button class="ib jump" data-jump="${esc(s.node.id)}" title="Leave the trace and inspect this module's imports">Inspect ${esc(s.node.label)} →</button></div>`;
    }
    if (s.n === LOOP_END) html += `<div class="tloop">↻ Steps ${LOOP_START}–${LOOP_END} repeat on every engine step: once for the prefill, then once per generated token, until a stop condition hits. Output streams back after each one.</div>`;
  });
  html += `</div>`;
  const top = insp.scrollTop;

  insp.dataset.key = 'trace';
  insp.scrollTop = top;
  const curEl = insp.querySelector('.ts.cur');
  if (curEl) { const r = curEl.getBoundingClientRect(), ir = insp.getBoundingClientRect(); if (r.top < ir.top + 100 || r.bottom > ir.bottom - 40) insp.scrollTop += r.top - ir.top - 110; }
}
$('#traceBtn').addEventListener('click', () => tracing ? exitTrace() : enterTrace());

// ---------- boot ----------
$('#nEager').textContent = edges.filter(e => e.eager).length; $('#nLazy').textContent = edges.filter(e => e.lazy).length;
$('#nType').textContent = edges.filter(e => e.type).length; $('#nBack').textContent = edges.filter(e => e.back).length;
$('#meta').innerHTML = `<a href="${GH}" target="_blank" rel="noopener">vllm-project/vllm</a> @ ${esc(D.meta.commit)} · ${esc(D.meta.date)}`;
applyFilters();
renderInspector();
const fit = () => { Object.assign(view, fitTo(nodes)); applyView(); };
fit();
{
  const m = /^#step(\d{1,2})$/.exec(location.hash);
  if (location.hash === '#explore') renderInspector();

}
new ResizeObserver(() => { miniDirty = true; scheduleMini(); if (tracing) positionCard(); }).observe(stage);
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', m => reduceMotion = m.matches);
})();
